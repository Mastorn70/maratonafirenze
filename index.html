<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maratona Firenze — Piano Atleti</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bg:#0a0a0f;--surf:#18181d;--card:#1f1f28;--b1:#2a2a35;--b2:#363645;
  --accent:#ff5c35;--gold:#f5c842;--teal:#2dd4bf;--purple:#a78bfa;--blue:#38bdf8;
  --txt:#eef0f4;--txt2:#9498a8;--txt3:#5a5e70;
  --easy:#34d399;--medio:#fbbf24;--lungo:#fb7185;--rep:#a78bfa;--cross:#38bdf8;
}
[data-theme="light"]{
  --bg:#f4f5f7;--surf:#ffffff;--card:#eef0f4;--b1:#d8dae0;--b2:#c0c3ce;
  --txt:#1a1b1e;--txt2:#4a4e5e;--txt3:#8a8e9e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;transition:background .25s,color .25s;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,textarea,select{font-family:'Inter',sans-serif;}
.mono{font-family:'DM Mono',monospace;}
.syne{font-family:'Syne',sans-serif;}
.hidden{display:none!important;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeUp .3s ease both;}

/* ── SCREENS ── */
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.screen.hidden{display:none!important;}

/* ── PROFILES SCREEN ── */
.profiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.9rem;width:100%;max-width:700px;margin-top:1rem;}
.profile-card{background:var(--surf);border:1.5px solid var(--b1);border-radius:12px;padding:1.4rem 1rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.6rem;transition:all .2s;text-align:center;}
.profile-card:hover{transform:translateY(-2px);}
.profile-card .avatar{font-size:2.5rem;}
.profile-card .pname{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;}
.profile-card .pgoal{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--txt2);}
.new-card{background:transparent;border:1.5px dashed var(--b1);border-radius:12px;padding:1.4rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--txt3);transition:border-color .2s;}
.new-card:hover{border-color:var(--accent);color:var(--txt2);}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.ring-val{position:absolute;font-size:10px;font-weight:600;color:var(--txt2);font-family:'DM Mono',monospace;}

/* ── WIZARD ── */
.wiz-panel{width:100%;max-width:560px;background:var(--surf);border:1px solid var(--b1);border-radius:12px;padding:1.75rem;}
.wiz-dots{display:flex;gap:.5rem;margin:.75rem 0;}
.wiz-dot{height:4px;border-radius:2px;transition:all .3s;}
.wiz-dot.active{background:var(--accent);width:28px;}
.wiz-dot.done{background:var(--teal);width:28px;}
.wiz-dot.idle{background:var(--b1);width:20px;}
.field-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);display:block;margin-bottom:.4rem;}
.text-input{width:100%;background:var(--bg);border:1.5px solid var(--b1);border-radius:6px;
  padding:.55rem .8rem;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s;}
.text-input:focus{border-color:var(--accent);}
textarea.text-input{resize:vertical;}
.profile-tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.ptile{background:var(--bg);border:1.5px solid var(--b1);border-radius:8px;padding:.85rem;cursor:pointer;
  text-align:left;transition:all .2s;color:var(--txt);}
.ptile.sel{border-color:var(--accent);background:rgba(255,92,53,.08);}
.ptile .ti{font-size:1.1rem;margin-bottom:.25rem;}
.ptile .tn{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;}
.ptile .ts{font-size:.72rem;color:var(--txt2);margin-top:.15rem;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;}
.day-btn{padding:.5rem .1rem;border-radius:6px;border:1.5px solid var(--b1);background:var(--bg);
  color:var(--txt2);font-size:11px;font-weight:700;text-align:center;cursor:pointer;transition:all .2s;}
.day-btn.run-sel{border-color:var(--accent);background:rgba(255,92,53,.12);color:var(--accent);}
.day-btn.cross-sel{border-color:var(--blue);background:rgba(56,189,248,.1);color:var(--blue);}
.day-btn.disabled{opacity:.3;cursor:not-allowed;}
.gara-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.gara-btn{padding:.55rem;border-radius:6px;border:1.5px solid var(--b1);background:var(--bg);
  color:var(--txt2);font-size:12px;cursor:pointer;text-align:center;transition:all .2s;}
.gara-btn.sel{border-color:var(--teal);background:rgba(45,212,191,.1);color:var(--teal);}
.summary-box{background:var(--bg);border:1px solid var(--b1);border-radius:8px;padding:1rem;
  font-size:13px;line-height:2.1;color:var(--txt2);}
.summary-box strong{color:var(--txt);}
.wiz-nav{display:flex;gap:.6rem;width:100%;max-width:560px;margin-top:.75rem;}
.wiz-btn{flex:1;padding:.75rem;border-radius:8px;font-size:14px;font-weight:600;border:none;transition:all .2s;}
.wiz-btn.back{background:var(--surf);color:var(--txt2);border:1.5px solid var(--b1);}
.wiz-btn.back:hover{color:var(--txt);}
.wiz-btn.next{background:var(--accent);color:#fff;flex:2;}
.wiz-btn.next:hover{filter:brightness(1.1);}
.wiz-btn:disabled{opacity:.35;cursor:not-allowed;}
.range-row{display:flex;align-items:center;gap:.75rem;}
.range-row input[type=range]{flex:1;accent-color:var(--accent);height:3px;}
.preset-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem;}
.preset-btn{font-family:'DM Mono',monospace;font-size:.8rem;padding:.3rem .7rem;border-radius:4px;
  border:1.5px solid var(--b1);background:var(--card);color:var(--txt2);cursor:pointer;transition:all .2s;}
.preset-btn.sel{border-color:var(--accent);background:rgba(255,92,53,.12);color:var(--accent);}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.97);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--b1);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
.back-btn{background:none;border:none;color:var(--txt3);font-size:1.2rem;padding:.2rem;}
.back-btn:hover{color:var(--txt2);}
.profile-badge{font-size:.95rem;font-weight:700;}
.goal-ctrl-wrap{display:flex;align-items:center;gap:.3rem;position:relative;}
.goal-step-btn{background:var(--surf);border:1px solid var(--b1);border-radius:5px;color:var(--txt2);font-size:1rem;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;line-height:1;}
.goal-step-btn:hover{border-color:var(--accent);color:var(--accent);}
.goal-val-btn{font-family:'DM Mono',monospace;font-size:.9rem;color:var(--accent);min-width:3rem;text-align:center;background:var(--surf);border:1px solid var(--b1);border-radius:5px;padding:.25rem .4rem;cursor:pointer;transition:all .15s;}
.goal-val-btn:hover{border-color:var(--accent);}
.goal-picker{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--b2);border-radius:8px;padding:.4rem;display:flex;flex-wrap:wrap;gap:.3rem;z-index:200;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
.goal-preset-btn{background:var(--surf);border:1px solid var(--b1);border-radius:5px;color:var(--txt2);font-family:'DM Mono',monospace;font-size:.72rem;padding:.28rem .5rem;cursor:pointer;transition:all .15s;}
.goal-preset-btn:hover{border-color:var(--accent);color:var(--accent);}
.goal-preset-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.zone-chips{display:flex;gap:.3rem;flex-wrap:wrap;flex:1;}
.zchip{font-family:'DM Mono',monospace;font-size:10px;padding:.15rem .45rem;border-radius:20px;border:1px solid;white-space:nowrap;}
.tab-bar{display:flex;gap:.25rem;margin-left:auto;}
.tab-btn{padding:.3rem .7rem;border-radius:6px;border:none;font-size:11px;font-weight:600;transition:all .2s;cursor:pointer;}
.tab-btn.active{background:var(--accent);color:#fff;}
.tab-btn:not(.active){background:var(--surf);color:var(--txt2);}
.plan-shell{display:flex;align-items:stretch;min-height:calc(100vh - 58px);}
.athlete-sidebar{width:190px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--b1);padding:.9rem .65rem;}
.athlete-sidebar-title{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);padding:.3rem .45rem .65rem;}
.athlete-list{display:flex;flex-direction:column;gap:.3rem;}
.athlete-switch-btn{display:flex;align-items:center;gap:.5rem;width:100%;padding:.55rem .5rem;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--txt2);text-align:left;cursor:pointer;transition:all .18s;}
.athlete-switch-btn:hover{background:rgba(255,255,255,.04);color:var(--txt);}
.athlete-switch-btn.active{border-color:rgba(255,92,53,.45);background:rgba(255,92,53,.1);color:var(--txt);}
.athlete-switch-icon{font-size:1rem;flex-shrink:0;}
.athlete-switch-name{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.athlete-switch-goal{display:block;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--txt3);margin-top:.12rem;}
.athlete-add-btn{width:100%;margin-top:.7rem;padding:.5rem;border:1px dashed var(--b2);border-radius:6px;background:transparent;color:var(--txt3);font-size:.72rem;cursor:pointer;}
.athlete-add-btn:hover{border-color:var(--accent);color:var(--accent);}
.plan-main{flex:1;min-width:0;}
@media(max-width:760px){
  .plan-shell{display:block;min-height:0;}
  .athlete-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--b1);padding:.55rem .75rem;}
  .athlete-sidebar-title{padding:.15rem .2rem .4rem;}
  .athlete-list{flex-direction:row;overflow-x:auto;padding-bottom:.15rem;}
  .athlete-switch-btn{width:auto;min-width:120px;}
  .athlete-add-btn{width:auto;margin:.45rem 0 0;}
  .weekly-load-layout{grid-template-columns:1fr;}
  .weekly-load-filter-panel{border-left:none;border-top:1px solid var(--b1);padding:.75rem 0 0;display:grid;grid-template-columns:repeat(2,1fr);}
  .weekly-load-filter-title{grid-column:1/-1;}
  .weekly-load-reset{margin-top:0;grid-column:1/-1;}
  .topbar{padding:.55rem .7rem;gap:.5rem;}
  .back-btn{font-size:1.1rem;padding:.25rem .35rem;}
  .profile-badge{font-size:.82rem;max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .goal-ctrl-wrap{order:3;}
  .goal-picker{left:0;transform:none;}
  .zone-chips{order:4;width:100%;flex:none;overflow-x:auto;flex-wrap:nowrap;padding-bottom:.15rem;}
  .tab-bar{order:2;margin-left:auto;max-width:55%;overflow-x:auto;}
  .tab-btn{padding:.42rem .55rem;white-space:nowrap;font-size:10px;}
  .plan-wrap{padding:1rem .65rem 3rem;}
  #tab-plan{min-width:0;overflow:hidden;}
  .week-card{overflow:visible;}
  .week-hdr{padding:.65rem .7rem;gap:.45rem;}
  .week-dates{font-size:.65rem;white-space:nowrap;}
  .adh-dots{display:none;}
  .week-km{font-size:.72rem;white-space:nowrap;}
  .wtag{font-size:.55rem;padding:.12rem .35rem;}
  .sessions-row{min-width:650px;}
  #tab-plan .week-card{min-width:0;overflow:hidden;}
  #tab-plan .week-card>div[id^="wsess-"]{overflow-x:auto;min-width:0;}
  .session{min-height:118px;padding:.65rem .55rem;}
  .s-desc{font-size:.68rem;}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;}
  .stat-card{padding:.7rem .55rem;gap:.45rem;}
  .stat-val{font-size:1.2rem;}
  .stat-sub{font-size:.65rem;}
  .form-grid{grid-template-columns:1fr;}
  .modal-box{padding:1.15rem;max-height:92vh;}
  .weekly-load-bars{gap:.18rem;}
}

/* ── PLAN ── */
.plan-wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 4rem;}
.plan-total-bar{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:.8rem 1rem;margin-bottom:1.25rem;}
.plan-total-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);}
.plan-total-value{font-family:'DM Mono',monospace;font-size:1.1rem;color:var(--gold);}
.weekly-load-chart{background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:.5rem .65rem;margin-bottom:1.5rem;}
.weekly-load-layout{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:.75rem;align-items:stretch;}
.weekly-load-filter-panel{border-left:1px solid var(--b1);padding-left:1rem;display:flex;flex-direction:column;gap:.35rem;}
.weekly-load-filter-title{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:.2rem;}
.weekly-load-filter-btn{display:flex;align-items:center;gap:.4rem;padding:.35rem .45rem;border:1px solid var(--b1);border-radius:5px;background:var(--bg);color:var(--txt2);font-size:.68rem;text-align:left;cursor:pointer;transition:all .18s;}
.weekly-load-filter-btn:hover{border-color:var(--b2);color:var(--txt);}
.weekly-load-filter-btn.active{border-color:var(--filter-color);background:color-mix(in srgb,var(--filter-color) 14%,transparent);color:var(--txt);}
.weekly-load-filter-dot{width:7px;height:7px;border-radius:50%;background:var(--filter-color);flex-shrink:0;}
.weekly-load-reset{margin-top:auto;padding:.35rem;border:1px solid var(--b1);border-radius:5px;background:transparent;color:var(--txt3);font-size:.65rem;cursor:pointer;}
.weekly-load-reset:hover{color:var(--txt);border-color:var(--b2);}
.weekly-load-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);}
.weekly-load-legend{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.35rem;font-size:.65rem;color:var(--txt3);}
.weekly-load-legend span{display:flex;align-items:center;gap:.3rem;font-weight:500;}
.weekly-load-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;}
.weekly-load-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:1rem;}
.weekly-load-layout{display:grid;grid-template-columns:minmax(320px,1fr) 145px;gap:.75rem;align-items:stretch;min-width:480px;}
.weekly-load-bars{height:150px;display:grid;grid-template-columns:repeat(14,minmax(22px,1fr));gap:.3rem;align-items:end;}
.weekly-load-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.2rem;flex-shrink:0;}
.weekly-load-value{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--txt2);white-space:nowrap;}
.weekly-load-stack{width:100%;max-width:30px;min-width:12px;min-height:3px;border-radius:3px 3px 1px 1px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:height .35s ease;}
.weekly-load-segment{width:100%;min-height:2px;transition:height .35s ease;}
.weekly-load-segment:first-child{border-radius:3px 3px 0 0;}
.weekly-load-label{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--txt3);}
@media(max-width:760px){
  .weekly-load-scroll-wrap{margin-top:.65rem;}
  .weekly-load-layout{min-width:520px;}
  .weekly-load-bars{height:120px;gap:.22rem;}
  .weekly-load-value{font-size:.48rem;}
  .weekly-load-label{font-size:.48rem;}
  .weekly-load-stack{max-width:22px;}
  .weekly-load-legend{gap:.45rem;font-size:.58rem;}
  .weekly-load-filter-title{font-size:.58rem;}
  .weekly-load-filter-btn{font-size:.62rem;padding:.28rem .38rem;}
}
.phase-hdr{display:flex;align-items:baseline;gap:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--b1);margin:2rem 0 .75rem;}
.phase-badge{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);background:rgba(255,92,53,.1);padding:.18rem .55rem;border-radius:4px;}
.phase-name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;}

.week-card{background:var(--surf);border:1px solid var(--b1);border-radius:8px;margin-bottom:.5rem;overflow:hidden;transition:border-color .2s;}
.week-card.current-week{border-color:rgba(255,92,53,.5);box-shadow:0 0 0 1px rgba(255,92,53,.15);}
.week-card.peak-week{border-color:rgba(245,200,66,.25);}
.week-card.rest-week{border-color:rgba(52,211,153,.2);}
.week-hdr{display:flex;align-items:center;gap:.85rem;padding:.7rem 1rem;
  background:rgba(255,255,255,.02);cursor:pointer;user-select:none;border-bottom:1px solid transparent;}
.week-hdr.open{border-bottom-color:var(--b1);}
.week-n{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500;color:var(--accent);min-width:2.5rem;}
.week-badge{font-size:9px;color:var(--accent);border:1px solid rgba(255,92,53,.4);
  border-radius:20px;padding:.1rem .4rem;letter-spacing:.1em;white-space:nowrap;}
.week-dates{font-size:.72rem;color:var(--txt3);flex:1;}
.adh-dots{display:flex;gap:3px;align-items:center;}
.adh-dot{width:7px;height:7px;border-radius:50%;}
.week-km{font-family:'DM Mono',monospace;font-size:.82rem;color:var(--gold);}
.wtag{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px;}
.wtag-c{background:rgba(251,191,36,.1);color:var(--medio);}
.wtag-r{background:rgba(52,211,153,.1);color:var(--easy);}
.wtag-g{background:rgba(255,92,53,.1);color:var(--lungo);}
.wtag-p{background:rgba(245,200,66,.1);color:var(--gold);}
.chevron{color:var(--txt3);font-size:.8rem;transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}

.sessions-row{display:grid;background:var(--card);}
.session{padding:.8rem .9rem;border-right:1px solid var(--b1);cursor:pointer;transition:background .15s;}
.session:hover{background:rgba(255,255,255,.03);}
.session:last-child{border-right:none;}
.session.logged-ok{background:rgba(52,211,153,.04);}
.session.logged-skip{background:rgba(248,113,113,.04);}
.s-day{font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:.28rem;}
.s-date{font-family:'DM Mono',monospace;font-size:.62rem;font-weight:400;letter-spacing:0;color:var(--txt3);opacity:.7;}
.s-type{display:flex;align-items:center;gap:.28rem;margin-bottom:.3rem;}
.s-type-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.s-type-lbl{font-family:'Syne',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.s-km{font-family:'DM Mono',monospace;font-size:1.15rem;color:var(--txt);line-height:1;margin-bottom:.22rem;}
.s-cross-dur{font-family:'DM Mono',monospace;font-size:1.15rem;color:var(--cross);line-height:1;margin-bottom:.22rem;}
.s-desc{font-size:.71rem;color:var(--txt2);line-height:1.42;margin-bottom:.28rem;}
.s-pace{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--gold);}
.s-log-data{margin-top:.45rem;padding-top:.4rem;border-top:1px solid var(--b1);display:flex;gap:.4rem;flex-wrap:wrap;}
.s-log-chip{font-size:.68rem;font-family:'DM Mono',monospace;}
.s-status{position:relative;}
.s-status-badge{float:right;font-size:.95rem;}
.s-cta{font-size:.65rem;color:var(--b2);letter-spacing:.06em;margin-top:.25rem;}
.rest-cell{padding:.75rem;display:flex;align-items:center;justify-content:center;
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--b2);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:var(--surf);border:1px solid var(--b2);border-radius:12px;padding:1.75rem;
  width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;}
.modal-close{background:none;border:none;color:var(--txt3);font-size:1.3rem;padding:.2rem;}
.modal-close:hover{color:var(--txt2);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.form-grid.full{grid-template-columns:1fr;}
.feel-row{display:flex;gap:.4rem;}
.feel-btn{flex:1;padding:.5rem;border-radius:6px;border:1.5px solid var(--b1);
  background:var(--bg);font-size:1.1rem;cursor:pointer;text-align:center;transition:all .2s;}
.feel-btn.sel{border-color:var(--accent);background:rgba(255,92,53,.12);}
.modal-actions{display:flex;gap:.6rem;margin-top:1.25rem;}
.modal-btn{flex:1;padding:.7rem;border-radius:8px;font-size:14px;font-weight:600;border:none;transition:all .2s;}
.modal-btn.cancel{background:var(--card);color:var(--txt2);border:1.5px solid var(--b1);}
.modal-btn.save{background:var(--accent);color:#fff;flex:2;}
.modal-btn.save:hover{filter:brightness(1.1);}
.modal-btn.danger{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);}
.check-row{display:flex;align-items:center;gap:.7rem;cursor:pointer;}
.check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}

/* ── DASHBOARD ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin-bottom:1.75rem;}
.stat-card{background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:1rem;
  display:flex;align-items:center;gap:.85rem;}
.stat-val{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--txt);line-height:1;}
.stat-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--txt3);margin-bottom:.2rem;}
.stat-sub{font-size:.72rem;color:var(--txt2);margin-top:.2rem;}
.adh-chart{background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:1.25rem;}
.adh-chart-bars{display:flex;gap:3px;align-items:flex-end;height:72px;margin-top:.75rem;}
.adh-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.adh-bar{width:100%;border-radius:2px;transition:height .4s;}
.adh-bar-lbl{font-size:7.5px;color:var(--txt3);}

/* ── HISTORY ── */
.log-list{display:flex;flex-direction:column;gap:.5rem;}
.log-entry{background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:.9rem 1rem;
  display:flex;gap:.85rem;align-items:flex-start;cursor:pointer;transition:border-color .2s;}
.log-entry:hover{border-color:var(--b2);}
.log-icon{font-size:1.3rem;flex-shrink:0;}
.log-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem;}
.log-chip{font-size:.7rem;color:var(--txt2);}
.log-chip.mono{font-family:'DM Mono',monospace;}
.log-note{font-size:.72rem;color:var(--txt3);font-style:italic;margin-top:.25rem;}
.log-del{background:none;border:none;color:var(--txt3);font-size:.9rem;padding:.2rem;margin-left:auto;}
.log-del:hover{color:#f87171;}
.empty-state{text-align:center;padding:3rem;color:var(--txt3);}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;}

/* ── PACE TABLE ── */
.pace-table-wrap{background:var(--surf);border:1px solid var(--b1);border-radius:8px;overflow:hidden;margin-top:1.5rem;}
.pace-table-hdr{padding:.75rem 1.25rem;background:rgba(255,92,53,.08);border-bottom:1px solid var(--b1);
  font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
table.ptable{width:100%;border-collapse:collapse;font-size:.82rem;}
table.ptable th{padding:.5rem 1.1rem;text-align:left;font-size:.62rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--b1);}
table.ptable td{padding:.6rem 1.1rem;border-bottom:1px solid rgba(42,42,53,.5);vertical-align:middle;}
table.ptable tr:last-child td{border-bottom:none;}
.pname{display:flex;align-items:center;gap:.5rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;text-transform:uppercase;}
.pval{font-family:'DM Mono',monospace;font-size:.88rem;font-weight:500;color:var(--gold);}

/* ── SESSION EDITOR ── */
.editor-section{margin-bottom:1rem;}
.editor-section-title{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid var(--b1);}
.editor-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;}
.etype-btn{padding:.45rem .2rem;border-radius:6px;border:1.5px solid var(--b1);background:var(--bg);
  font-size:.7rem;font-weight:700;text-transform:uppercase;text-align:center;cursor:pointer;transition:all .2s;color:var(--txt2);}
.etype-btn.sel{border-color:var(--accent);background:rgba(255,92,53,.1);color:var(--accent);}
.editor-row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.7rem;}
.editor-row.single{grid-template-columns:1fr;}
.unsaved-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;
  background:rgba(245,200,66,.12);color:var(--gold);border:1px solid rgba(245,200,66,.25);
  border-radius:20px;padding:.18rem .55rem;margin-left:.5rem;}

/* ── PROFILE ACTIONS BAR (profiles screen) ── */
.profile-actions-bar{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;
  margin-top:1.5rem;width:100%;max-width:700px;}
.pab-btn{display:flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border-radius:6px;
  border:1.5px solid var(--b1);background:var(--surf);color:var(--txt2);font-size:.8rem;
  font-weight:600;cursor:pointer;transition:all .2s;}
.pab-btn:hover{border-color:var(--b2);color:var(--txt);}
.pab-btn.danger:hover{border-color:#f87171;color:#f87171;}

/* ── ATHLETE ACTIONS MENU ── */
.athlete-menu{position:relative;margin-left:auto;}
.athlete-menu-btn{display:flex;align-items:center;gap:.3rem;padding:.35rem .75rem;border-radius:6px;
  border:1px solid var(--b1);background:var(--surf);color:var(--txt2);font-size:.8rem;cursor:pointer;transition:all .2s;}
.athlete-menu-btn:hover{border-color:var(--b2);color:var(--txt);}
.athlete-menu-drop{position:absolute;top:calc(100% + .4rem);right:0;background:var(--surf);
  border:1px solid var(--b2);border-radius:8px;min-width:200px;overflow:hidden;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.5);}
.athlete-menu-drop.hidden{display:none;}
.amenu-item{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;font-size:.82rem;
  cursor:pointer;transition:background .15s;color:var(--txt2);border:none;background:transparent;width:100%;text-align:left;}
.amenu-item:hover{background:rgba(255,255,255,.04);color:var(--txt);}
.amenu-item.danger:hover{background:rgba(248,113,113,.08);color:#f87171;}
.amenu-sep{height:1px;background:var(--b1);margin:.25rem 0;}

/* ── INLINE EDIT INDICATOR on session card ── */
.session.has-edits{box-shadow:inset 3px 0 0 var(--gold);}
.edit-indicator{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:.2rem;}

/* ── FULL-PAGE PLAN EDITOR ── */
#scr-editor{display:none;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg);}
#scr-editor.visible{display:flex;}
.editor-topbar{display:flex;align-items:center;gap:.85rem;padding:.6rem 1rem;
  background:var(--surf);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;}
.editor-topbar-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;flex:1;}
.editor-topbar-hint{font-size:.72rem;color:var(--txt3);}
.ed-btn{padding:.4rem .9rem;border-radius:6px;font-size:.8rem;font-weight:600;
  border:1.5px solid var(--b1);background:var(--card);color:var(--txt2);cursor:pointer;transition:all .2s;}
.ed-btn:hover{border-color:var(--b2);color:var(--txt);}
.ed-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.ed-btn.primary:hover{filter:brightness(1.08);}
.ed-btn.ghost{background:transparent;border-color:transparent;color:var(--txt3);}
.ed-btn.ghost:hover{color:var(--txt2);}

.editor-body{display:flex;flex:1;overflow:hidden;}

/* Left sidebar – session palette */
.ed-palette{width:200px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--b1);
  display:flex;flex-direction:column;overflow-y:auto;}
.ed-palette-title{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--txt3);padding:.85rem 1rem .5rem;}
.palette-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;
  cursor:grab;transition:background .15s;user-select:none;border-bottom:1px solid rgba(42,42,53,.4);}
.palette-item:hover{background:rgba(255,255,255,.04);}
.palette-item:active{cursor:grabbing;}
.palette-item.dragging{opacity:.4;}
.pi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pi-name{font-size:.8rem;font-weight:600;color:var(--txt);}
.pi-sub{font-size:.68rem;color:var(--txt3);}
.ed-palette-sep{height:1px;background:var(--b1);margin:.4rem .75rem;}
.ed-palette-section{font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt3);padding:.6rem 1rem .3rem;}

/* Main grid */
.ed-grid-wrap{flex:1;min-width:0;overflow:auto;padding:1rem;}
.ed-week-row{display:grid;grid-template-columns:56px repeat(7,1fr);gap:3px;margin-bottom:3px;}
.ed-week-label{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:.75rem;font-weight:500;color:var(--accent);
  background:var(--surf);border-radius:4px;border:1px solid var(--b1);padding:.3rem;}
.ed-week-label small{font-size:.55rem;color:var(--txt3);margin-top:.1rem;text-align:center;}
.ed-day-header{display:grid;grid-template-columns:56px repeat(7,1fr);gap:3px;margin-bottom:4px;position:sticky;top:0;z-index:10;}
.ed-day-hdr{background:var(--card);border-radius:4px;padding:.35rem .2rem;text-align:center;
  font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);}
.ed-day-hdr.today-col{color:var(--accent);}

/* Session cell in editor grid */
.ed-cell{min-height:72px;border-radius:5px;border:1.5px solid var(--b1);background:var(--card);
  padding:.45rem .5rem;cursor:pointer;transition:all .18s;position:relative;
  display:flex;flex-direction:column;gap:.18rem;}
.ed-cell:hover{border-color:var(--b2);background:#22222c;}
.ed-cell.rest{background:transparent;border-style:dashed;border-color:var(--b1);cursor:default;}
.ed-cell.rest:hover{background:rgba(255,255,255,.02);border-color:var(--b2);}
.ed-cell.drag-src{opacity:.45;border-style:dashed;transform:scale(.97);}
.ed-cell.drag-over-swap{border-color:var(--teal)!important;background:rgba(45,212,191,.12)!important;
  box-shadow:inset 0 0 0 2px var(--teal);}
.ed-cell[draggable="true"]{cursor:grab;}
.ed-cell[draggable="true"]:active{cursor:grabbing;}
.ed-cell.drag-src{opacity:.35;border-style:dashed;border-color:var(--accent)!important;}
.ed-cell.drag-over-swap{border-color:var(--teal)!important;background:rgba(45,212,191,.12)!important;
  box-shadow:inset 0 0 0 1px var(--teal);}
/* Rest cells must also be visible drop targets */
.ed-cell.rest{cursor:default;}
.ed-cell.rest.drag-over-swap,.ed-cell.rest.drag-over{
  border-style:solid!important;border-color:var(--teal)!important;
  background:rgba(45,212,191,.1)!important;}
/* Garmin export panel */
.garmin-panel{display:none!important;}
.garmin-panel-hdr{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;
  background:rgba(0,112,193,.1);border-bottom:1px solid var(--b1);}
.garmin-logo{font-size:1.1rem;}
.garmin-hdr-title{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#38bdf8;}
.garmin-hdr-sub{font-size:.72rem;color:var(--txt3);margin-left:auto;}
.garmin-body{padding:1rem 1.25rem;}
.garmin-info{font-size:.78rem;color:var(--txt2);line-height:1.6;margin-bottom:1rem;}
.garmin-week-select{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.85rem;}
.gw-btn{font-family:'DM Mono',monospace;font-size:.72rem;padding:.3rem .6rem;border-radius:4px;
  border:1px solid var(--b1);background:var(--card);color:var(--txt2);cursor:pointer;transition:all .2s;}
.gw-btn:hover{border-color:var(--b2);color:var(--txt);}
.gw-btn.sel{border-color:var(--blue);background:rgba(56,189,248,.1);color:var(--blue);}
.gw-btn.all{border-color:var(--accent);color:var(--accent);background:rgba(255,92,53,.08);}
.garmin-export-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.garmin-export-btn{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:6px;
  border:none;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;}
.garmin-export-btn.fit{background:#0070c1;color:#fff;}
.garmin-export-btn.fit:hover{filter:brightness(1.12);}
.garmin-export-btn.tcx{background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3);}
.garmin-export-btn.tcx:hover{background:rgba(56,189,248,.25);}
.garmin-export-btn.ics{background:rgba(45,212,191,.12);color:#2dd4bf;border:1px solid rgba(45,212,191,.25);}
.garmin-export-btn.ics:hover{background:rgba(45,212,191,.22);}
.garmin-note{font-size:.7rem;color:var(--txt3);margin-top:.75rem;line-height:1.5;}
.ed-cell.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,200,66,.2);}
.ed-cell.multi-selected{border-color:var(--teal);box-shadow:0 0 0 2px rgba(45,212,191,.22);}
.ed-cell.edited{box-shadow:inset 3px 0 0 var(--gold);}
.ed-cell.logged{box-shadow:inset 3px 0 0 #34d399;}
.ec-type{display:flex;align-items:center;gap:.3rem;}
.ec-type-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.ec-type-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.ec-km{font-family:'DM Mono',monospace;font-size:.95rem;font-weight:500;color:var(--txt);line-height:1;}
.ec-desc{font-size:.6rem;color:var(--txt3);line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ec-pace{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--gold);}
.ec-actions{position:absolute;top:.25rem;right:.25rem;display:none;gap:.15rem;}
.ed-cell:hover .ec-actions{display:flex;}
.ec-act-btn{background:var(--b2);border:none;border-radius:3px;color:var(--txt2);
  font-size:.65rem;padding:.15rem .3rem;cursor:pointer;transition:all .15s;line-height:1;}
.ec-act-btn:hover{background:var(--accent);color:#fff;}

/* Right panel – inline editor */
.ed-panel{width:260px;flex-shrink:0;background:var(--surf);border-left:1px solid var(--b1);
  display:flex;flex-direction:column;overflow-y:auto;}
.ed-panel-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--txt3);font-size:.82rem;text-align:center;padding:2rem;gap:.5rem;}
.ed-panel-empty-icon{font-size:2rem;}
.ed-panel-content{padding:1rem;display:flex;flex-direction:column;gap:.85rem;}
.ed-panel-hdr{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;
  padding:.85rem 1rem .5rem;border-bottom:1px solid var(--b1);}
.ed-panel-hdr small{display:block;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:400;color:var(--txt3);margin-top:.15rem;}
.ed-field label{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);display:block;margin-bottom:.3rem;}
.ed-input{width:100%;background:var(--bg);border:1.5px solid var(--b1);border-radius:5px;
  padding:.45rem .65rem;color:var(--txt);font-size:.82rem;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif;}
.ed-input:focus{border-color:var(--accent);}
textarea.ed-input{resize:vertical;font-size:.78rem;}
.ed-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;}
.ed-type-btn{padding:.4rem .3rem;border-radius:5px;border:1.5px solid var(--b1);background:var(--bg);
  font-size:.68rem;font-weight:700;text-transform:uppercase;text-align:center;cursor:pointer;
  transition:all .18s;color:var(--txt2);}
.ed-type-btn.sel{color:var(--txt);}
.ed-panel-actions{padding:1rem;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:.4rem;margin-top:auto;}
.ed-save-btn{width:100%;padding:.6rem;border-radius:6px;border:none;background:var(--accent);
  color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;transition:filter .2s;}
.ed-save-btn:hover{filter:brightness(1.1);}
.ed-reset-btn{width:100%;padding:.5rem;border-radius:6px;border:1px solid var(--b1);
  background:transparent;color:var(--txt3);font-size:.75rem;cursor:pointer;transition:all .2s;}
.ed-reset-btn:hover{border-color:#f87171;color:#f87171;}

@media(max-width:900px){
  .ed-palette{width:160px;}
  .ed-panel{width:220px;}
}
@media(max-width:650px){
  .ed-palette{display:none;}
  .editor-topbar{padding:.5rem .65rem;gap:.4rem;}
  .editor-topbar-title{font-size:.88rem;min-width:0;}
  .editor-topbar-hint{display:none;}
  .editor-topbar .ed-btn{padding:.38rem .55rem;font-size:.68rem;}
  .ed-panel{width:100%;position:fixed;bottom:0;left:0;right:0;height:44vh;max-height:420px;border-top:1px solid var(--b2);z-index:50;}
  #scr-editor{height:100dvh;min-height:100vh;}
  .editor-body{flex-direction:column;min-width:0;}
  .ed-grid-wrap{min-height:56vh;padding:.65rem;overflow:auto;}
  .ed-day-header,.ed-week-row{grid-template-columns:48px repeat(7,minmax(76px,1fr));}
  .ed-day-hdr{font-size:.58rem;}
  .ed-week-label{font-size:.68rem;}
}

/* ── IMPORT & COMPARE ── */
.import-drop-zone{border:2px dashed var(--b2);border-radius:10px;padding:2rem 1.5rem;text-align:center;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.import-drop-zone:hover,.import-drop-zone.drag-active{border-color:var(--teal);background:rgba(45,212,191,.04);}
.import-drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2;}
.import-formats{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem;}
.fmt-badge{font-size:.65rem;font-weight:700;letter-spacing:.08em;padding:.18rem .5rem;border-radius:4px;
  background:var(--card);border:1px solid var(--b2);color:var(--txt2);}
.import-preview{margin-top:.85rem;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:.35rem;}
.import-row{display:flex;align-items:center;gap:.65rem;background:var(--card);border:1px solid var(--b1);
  border-radius:6px;padding:.5rem .75rem;font-size:.78rem;transition:border-color .15s;}
.import-row.matched{border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.04);}
.import-row-info{flex:1;min-width:0;}
.import-row-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.import-row-date{font-size:.65rem;color:var(--txt3);}
.import-row-stats{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.12rem;}
.import-stat{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--txt2);}
.import-match-badge{font-size:.62rem;padding:.12rem .4rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.import-match-badge.ok{background:rgba(45,212,191,.15);color:var(--teal);border:1px solid rgba(45,212,191,.3);}
.import-match-badge.guess{background:rgba(251,191,36,.1);color:var(--medio);border:1px solid rgba(251,191,36,.25);}
.import-match-badge.none{background:var(--card);color:var(--txt3);border:1px solid var(--b1);}
.import-actions{display:flex;gap:.5rem;margin-top:.85rem;flex-wrap:wrap;}
.import-progress{height:3px;background:var(--b1);border-radius:2px;margin:.5rem 0;overflow:hidden;}
.import-progress-bar{height:100%;background:var(--teal);border-radius:2px;transition:width .5s;}
/* compare tab */
.cmp-section{background:var(--surf);border:1px solid var(--b1);border-radius:8px;padding:1.1rem;margin-bottom:.85rem;}
.cmp-section-title{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:.85rem;padding-bottom:.4rem;border-bottom:1px solid var(--b1);}
.cmp-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.cmp-table th{padding:.4rem .7rem;text-align:left;font-size:.6rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--b1);}
.cmp-table td{padding:.5rem .7rem;border-bottom:1px solid rgba(42,42,53,.4);vertical-align:middle;}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-table tr:hover td{background:rgba(255,255,255,.02);}

/* ─── PRINT ─────────────────────────────────────────────── */
@media print {
  /* hide everything except the print container */
  body > *:not(#printContainer) { display: none !important; }
  #printContainer { display: block !important; }
}

/* The print container is always in the DOM but invisible on screen */
#printContainer {
  display: none;
  font-family: 'Inter', Arial, sans-serif;
  font-size: 9pt;
  color: #111;
  background: #fff;
}

@page {
  size: A4 landscape;
  margin: 10mm 10mm 12mm;
}

/* ── Cover ── */
.pr-cover {
  page-break-after: always;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  height: 180mm;
  padding: 0 8mm;
  border-bottom: 3pt solid #e8541a;
}
.pr-cover-eyebrow { font-size: 8pt; letter-spacing: .25em; text-transform: uppercase; color: #e8541a; margin-bottom: 6mm; }
.pr-cover-title   { font-size: 36pt; font-weight: 900; line-height: 1; color: #111; margin-bottom: 4mm; }
.pr-cover-title em{ color: #e8541a; font-style: normal; }
.pr-cover-meta    { display: flex; gap: 10mm; margin-top: 8mm; flex-wrap: wrap; }
.pr-cover-stat    { display: flex; flex-direction: column; }
.pr-cover-val     { font-size: 18pt; font-weight: 700; color: #e8541a; line-height: 1; }
.pr-cover-lbl     { font-size: 7pt; text-transform: uppercase; letter-spacing: .1em; color: #777; margin-top: 1mm; }
.pr-cover-zones   { margin-top: 8mm; display: flex; gap: 6mm; flex-wrap: wrap; }
.pr-zone-pill     { font-size: 7.5pt; border: .5pt solid #ccc; border-radius: 3pt; padding: 1mm 3mm; }
.pr-zone-lbl      { font-weight: 700; }

/* ── Phase header ── */
.pr-phase {
  background: #e8541a;
  color: #fff;
  font-size: 8pt;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: 1.5mm 4mm;
  margin-bottom: 2mm;
  margin-top: 4mm;
  break-inside: avoid;
}

/* ── Week block ── */
.pr-week {
  break-inside: avoid;
  margin-bottom: 3mm;
  border: .5pt solid #ddd;
  border-radius: 2pt;
  overflow: hidden;
}
.pr-week-hdr {
  background: #f5f5f5;
  display: flex;
  align-items: center;
  gap: 4mm;
  padding: 1.5mm 3mm;
  border-bottom: .5pt solid #ddd;
}
.pr-week-n    { font-size: 10pt; font-weight: 800; color: #e8541a; min-width: 10mm; }
.pr-week-date { font-size: 7.5pt; color: #666; flex: 1; }
.pr-week-km   { font-size: 8pt; font-weight: 700; color: #b8630f; }
.pr-week-tag  { font-size: 6.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
                border: .5pt solid #ccc; border-radius: 20pt; padding: .5mm 2mm; color: #555; }
.pr-week-tag.picco  { border-color: #d4a011; color: #b8860b; background: #fffbeb; }
.pr-week-tag.scarico{ border-color: #4caf50; color: #2e7d32; background: #f0fff0; }
.pr-week-tag.gara   { border-color: #e8541a; color: #e8541a; background: #fff5f0; }

/* ── Sessions grid ── */
.pr-sessions {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.pr-session {
  padding: 2mm 2.5mm;
  border-right: .5pt solid #eee;
  vertical-align: top;
  min-height: 16mm;
}
.pr-session:last-child { border-right: none; }
.pr-session.rest-cell  { background: #fafafa; }
.pr-sess-day  { font-size: 6pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #aaa; margin-bottom: .8mm; }
.pr-sess-type { display: flex; align-items: center; gap: 1mm; margin-bottom: .8mm; }
.pr-sess-dot  { width: 4pt; height: 4pt; border-radius: 50%; flex-shrink: 0; }
.pr-sess-lbl  { font-size: 7pt; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.pr-sess-km   { font-size: 11pt; font-weight: 700; color: #111; line-height: 1; margin-bottom: .5mm; }
.pr-sess-desc { font-size: 6.5pt; color: #555; line-height: 1.4; }
.pr-sess-pace { font-size: 6.5pt; color: #b8860b; font-weight: 600; margin-top: .5mm; font-family: monospace; }
.pr-rest-lbl  { font-size: 6pt; color: #ccc; text-transform: uppercase; letter-spacing: .08em; padding: 4mm 0; text-align: center; }

/* ── Pace legend (last page) ── */
.pr-legend-page  { page-break-before: always; padding: 4mm 0; }
.pr-legend-title { font-size: 12pt; font-weight: 800; color: #111; margin-bottom: 4mm; border-bottom: 1pt solid #e8541a; padding-bottom: 2mm; }
.pr-legend-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; }
.pr-legend-row   { display: flex; gap: 3mm; align-items: flex-start; padding: 2mm 0; border-bottom: .5pt solid #f0f0f0; }
.pr-legend-dot   { width: 7pt; height: 7pt; border-radius: 50%; flex-shrink: 0; margin-top: .5mm; }
.pr-legend-info  { flex: 1; }
.pr-legend-name  { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.pr-legend-pace  { font-size: 9pt; font-weight: 700; color: #b8860b; font-family: monospace; }
.pr-legend-desc  { font-size: 7pt; color: #666; margin-top: .5mm; line-height: 1.4; }
.pr-tip-grid     { display: grid; grid-template-columns: repeat(4,1fr); gap: 3mm; margin-top: 6mm; }
.pr-tip          { border: .5pt solid #ddd; border-radius: 2pt; padding: 2.5mm; }
.pr-tip-title    { font-size: 7.5pt; font-weight: 700; color: #e8541a; margin-bottom: 1mm; }
.pr-tip-body     { font-size: 7pt; color: #555; line-height: 1.5; }
.pr-footer       { margin-top: 6mm; border-top: .5pt solid #eee; padding-top: 2mm;
                   font-size: 6.5pt; color: #aaa; text-align: center; }
</style>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const START = new Date(2026,7,24);
const DAYS_S = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const DAYS_L = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const FEEL   = ['😖','😣','😐','😊','🔥'];

const PROFILES_DEF = {
  beginner:    {icon:'🌱', name:'Principiante', runs:3, peakLong:28, color:'#34d399', defaultGoal:270},
  intermediate:{icon:'🏃', name:'Intermedio',   runs:4, peakLong:35, color:'#38bdf8', defaultGoal:210},
  advanced:    {icon:'⚡', name:'Avanzato',      runs:5, peakLong:38, color:'#a78bfa', defaultGoal:195},
  elite:       {icon:'🏅', name:'Agonista',      runs:6, peakLong:42, color:'#f5c842', defaultGoal:175},
};
const SESS_META = {
  easy: {label:'Facile',    color:'#34d399'},
  rep:  {label:'Ripetute',  color:'#a78bfa'},
  medio:{label:'Medio',     color:'#fbbf24'},
  lungo:{label:'Lungo',     color:'#fb7185'},
  cross:{label:'Cross',     color:'#38bdf8'},
  rest: {label:'Riposo',    color:'#2a2a35'},
  race: {label:'GARA 🏆',   color:'#ff5c35'},
  test: {label:'Mezza Test',color:'#2dd4bf'},
};
const TARGET_PRESETS = [
  {l:'3:00',m:180},{l:'3:15',m:195},{l:'3:20',m:200},{l:'3:30',m:210},
  {l:'3:35',m:215},{l:'3:45',m:225},{l:'4:00',m:240},{l:'4:15',m:255},
  {l:'4:30',m:270},{l:'5:00',m:300}
];

// ═══════════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════════
// ── FIREBASE ────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBjA6MvfL6qWHeiQDtASYVZcePIXE1zHMc",
  authDomain: "running-7a13f.firebaseapp.com",
  databaseURL: "https://running-7a13f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "running-7a13f",
  storageBucket: "running-7a13f.firebasestorage.app",
  messagingSenderId: "95747151149",
  appId: "1:95747151149:web:d4b5173eb7e95c2ff26fa4"
};
let _db = null, _dbRef = null, _fbInitialized = false, _saveTimeout = null;

async function initFirebase() {
  if (_fbInitialized) return;
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getDatabase, ref, set, onValue } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const app = initializeApp(FIREBASE_CONFIG);
    _db = getDatabase(app);
    _dbRef = { ref, set, onValue };
    _fbInitialized = true;
    console.log('Firebase connesso \u2713');
  } catch(e) {
    console.warn('Firebase non disponibile, uso localStorage:', e);
  }
}

function loadStore() {
  try { return JSON.parse(localStorage.getItem('mfv3') || '{}'); } catch { return {}; }
}

function saveStore(s) {
  try { localStorage.setItem('mfv3', JSON.stringify(s)); } catch {}
  if (!_fbInitialized) return;
  clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(() => {
    const { ref, set } = _dbRef;
    set(ref(_db, 'athletes'), s).catch(e => console.warn('Firebase write error:', e));
  }, 600);
}

async function syncFromFirebase() {
  // Timeout di sicurezza: se Firebase non risponde in 5s, mostra i dati locali
  const fallbackTimer = setTimeout(() => hideLoading('locale'), 5000);

  await initFirebase();
  if (!_fbInitialized) {
    clearTimeout(fallbackTimer);
    hideLoading('locale');
    return;
  }
  const { ref, onValue } = _dbRef;
  let firstLoad = true;
  onValue(ref(_db, 'athletes'), (snapshot) => {
    clearTimeout(fallbackTimer);
    const data = snapshot.val();
    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
      store = data;
      try { localStorage.setItem('mfv3', JSON.stringify(store)); } catch {}
    }
    if (firstLoad) {
      firstLoad = false;
      hideLoading('firebase');
      renderProfiles();
    } else {
      // Aggiornamento in tempo reale successivo al primo
      if (activePid && store[activePid]) {
        // Utente gia' sulla dashboard: aggiorna solo i dati senza cambiare schermata
        const p = store[activePid];
        plan = buildPlan({
          profileKey: p.profileKey || 'intermediate',
          goalMin: p.goalMin || 210,
          runDays: p.runDays || [0,2,4,6],
          crossDay: p.crossDay ?? 1,
          garaTestWeek: p.garaTestWeek ?? 8,
          garaTestDay: p.garaTestDay ?? 6
        });
        zones = calcZones(p.goalMin || 210);
        applySessionEdits();
        if (document.getElementById('scr-plan') && document.getElementById('scr-plan').style.display !== 'none') renderTab();
        showSyncBadge();
      } else {
        // Nessun atleta attivo: aggiorna la lista profili
        renderProfiles();
      }
    }
  }, (error) => {
    clearTimeout(fallbackTimer);
    console.warn('Firebase read error:', error);
    hideLoading('locale');
  });
}

function hideLoading(source) {
  const el = document.getElementById('scr-loading');
  if (!el) return;
  el.style.opacity = '0';
  el.style.transition = 'opacity .3s';
  setTimeout(() => { el.style.display = 'none'; }, 320);
  if (source === 'locale') console.log('App avviata da localStorage');
}

function showSyncBadge() {
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  badge.textContent = '\u2601 sync';
  badge.style.opacity = '1';
  setTimeout(() => { badge.style.opacity = '0'; }, 2000);
}

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtD(d){return `${d.getDate()}/${d.getMonth()+1}`;}
function fmtGoal(t){const h=Math.floor(t/60),m=t%60;return `${h}:${m.toString().padStart(2,'0')}`;}
function fmtPace(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${sec.toString().padStart(2,'0')}`;}
function today(){return new Date().toISOString().split('T')[0];}
function weekLabel(wi){
  const s=addDays(START,wi*7),e=addDays(START,wi*7+6);
  return `${fmtD(s)}–${fmtD(e)}`;
}
function currentWeekIdx(){
  return Math.min(Math.max(Math.floor((new Date()-START)/(7*864e5)),0),13);
}
function calcZones(g){
  const mp=Math.round(g*60/42.195);
  return {
    race:{lo:mp,hi:mp+5}, mp:{lo:mp,hi:mp+10},
    longMP:{lo:mp+5,hi:mp+20}, longEasy:{lo:mp+25,hi:mp+50},
    threshold:{lo:mp-28,hi:mp-12}, rep:{lo:mp-52,hi:mp-32},
    easy:{lo:mp+32,hi:mp+70},
    halfTest:{lo:Math.round(mp*0.972),hi:Math.round(mp*0.972)+8},
  };
}
function paceStr(z,zone){
  if(!z[zone])return '';
  return `${fmtPace(z[zone].lo)}–${fmtPace(z[zone].hi)} /km`;
}
function el(id){return document.getElementById(id);}
function show(id){el(id).classList.remove('hidden');}
function hide(id){el(id).classList.add('hidden');}

// ═══════════════════════════════════════════════════════════════
// PLAN ENGINE
// ═══════════════════════════════════════════════════════════════
function buildPlan(cfg){
  const {profileKey,goalMin,runDays,crossDay,garaTestWeek,garaTestDay=6,raceDay=6}=cfg;
  const prof=PROFILES_DEF[profileKey];
  const z=calcZones(goalMin);
  const BASE_LONG=[20,21,24,17,26,28,30,16,21,prof.peakLong,23,17,10,5];
  if(garaTestWeek!==null) BASE_LONG[garaTestWeek]=21;
  const weeks=[];
  for(let wi=0;wi<14;wi++){
    const isPeak=wi===9, isRest=[3,7,11,12].includes(wi),
          isGara=garaTestWeek!==null&&wi===garaTestWeek, isRace=wi===13;
    const phase=wi<4?0:wi<9?1:2;
    const longKm=BASE_LONG[wi];
    const rd=[...runDays].sort((a,b)=>a-b);
    const specialDay=isRace?raceDay:garaTestDay;
    const specialIndex=rd.indexOf(specialDay);
    const assigns=assignSessions(wi,rd.length,longKm,phase,isRest,isPeak,isGara,isRace,z,specialIndex>=0?specialIndex:rd.length-1);
    const sessions=[];
    for(let day=0;day<7;day++){
      if(rd.includes(day)){
        sessions.push({day,dayName:DAYS_L[day],...assigns[rd.indexOf(day)]});
      } else if(day===crossDay){
        sessions.push({day,dayName:DAYS_L[day],type:'cross',dur:isRest?40:isPeak?65:55,
          desc:'Bici, nuoto o ellittica a intensità moderata.',pace:'FC 65–78%'});
      } else {
        sessions.push({day,dayName:DAYS_L[day],type:'rest'});
      }
    }
    const runKm=sessions.filter(s=>s.km).reduce((a,s)=>a+(s.km||0),0);
    const tag=isRace?'race':isGara?'gara':isPeak?'picco':isRest?'scarico':'carico';
    weeks.push({wi,label:`W${wi+1}`,dateRange:weekLabel(wi),sessions,runKm:Math.round(runKm),tag,isPeak,isRest});
  }
  return weeks;
}

function assignSessions(wi,n,longKm,phase,isRest,isPeak,isGara,isRace,z,specialIndex){
  if(isRace) {
    const raceSessions = [
    {type:'easy',km:8,  desc:'Corsa rilassata. Visualizza il percorso di Firenze.',zone:'easy'},
    {type:'rep', km:7,  desc:'20\' facile + 3×200m al ritmo gara + def.',zone:'rep'},
    {type:'easy',km:5,  desc:'20\' sciolta + 4 allunghi. Riposa sabato.',zone:'easy'},
    {type:'race',km:42.195,desc:'Parti 5–8" lento nei primi 5 km. Dal km 30 dai tutto!',zone:'race'},
    {type:'easy',km:10, desc:'Recupero post gara.',zone:'easy'},
    {type:'rep', km:8,  desc:'Attivazione leggera.',zone:'rep'},
    ];
    const race = raceSessions.splice(3,1)[0];
    raceSessions.splice(Math.min(specialIndex,n-1),0,race);
    return raceSessions.slice(0,n);
  }

  if(isGara) {
    const testSessions = [
    {type:'easy',km:10,desc:'Corsa sciolta. Preparazione settimana gara test.',zone:'easy'},
    {type:'rep', km:10,desc:'2 km risc. + 3×1000m vivaci + 3 km def.',zone:'rep'},
    {type:'easy',km:6, desc:'30\' facile + 4–5 allunghi. Gambe fresche.',zone:'easy'},
    {type:'test',km:21,desc:'Mezza maratona test. Conferma la forma.',zone:'halfTest'},
    {type:'easy',km:8, desc:'Recupero post gara test.',zone:'easy'},
    {type:'rep', km:9, desc:'Attivazione 2×2000m blandi.',zone:'rep'},
    ];
    const test = testSessions.splice(3,1)[0];
    testSessions.splice(Math.min(specialIndex,n-1),0,test);
    return testSessions.slice(0,n);
  }

  const bE=isRest?8:10, bR=isRest?11:12+Math.floor(phase), bM=isRest?11:12+phase;
  const pool=[
    {type:'easy',km:bE, desc:'Corsa di recupero. Ritmo istintivo, FC bassa.',zone:'easy'},
    {type:'rep', km:bR, desc:phase===0?'2 km risc. + 6×1000m (rec. 90") + 2 km def.':'3 km risc. + 4×2000m (rec. 90") + 3 km def.',zone:'rep'},
    {type:'medio',km:bM,desc:phase<2?`3 km risc. + ${bM-5} km soglia + 2 km def.`:`2 km risc. + ${bM-3} km a ritmo maratona + 1 def.`,zone:phase<2?'threshold':'mp'},
    {type:'lungo',km:longKm,
      desc:isPeak?`IL lungo più importante. km 10–${longKm-7} a ritmo MP. Testa tutto.`:
           wi>=4?`Lungo con ${Math.round(longKm*0.35)} km centrali a ritmo MP.`:
           'Corsa continua aerobica. Idratazione ogni 20\'.',
      zone:wi<4?'longEasy':'longMP', special:isPeak?'🏔 PICCO':''},
    {type:'easy',km:bE-2,desc:'Corsa sciolta aggiuntiva.',zone:'easy'},
    {type:'rep', km:bR-2,desc:'2 km risc. + 5×1000m (rec. 90") + 2 km def.',zone:'rep'},
  ];
  return pool.slice(0,n);
}

function buildRing(pct,r,stroke,color,label){
  const circ=2*Math.PI*r;
  const off=circ*(1-pct/100);
  return `<div class="ring-wrap" style="width:${(r+stroke)*2}px;height:${(r+stroke)*2}px">
    <svg width="${(r+stroke)*2}" height="${(r+stroke)*2}" style="position:absolute">
      <circle cx="${r+stroke}" cy="${r+stroke}" r="${r}" fill="none" stroke="#2a2a35" stroke-width="${stroke}"/>
      <circle cx="${r+stroke}" cy="${r+stroke}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"
        transform="rotate(-90 ${r+stroke} ${r+stroke})"/>
    </svg>
    <span class="ring-val" style="color:${color}">${label}</span>
  </div>`;
}

    const runDaysBtns=DAYS_S.map((d,i)=>{
      const isSel=wizCfg.runDays.includes(i),isCross=i===wizCfg.crossDay;
      return `<button class="day-btn ${isSel?'run-sel':isCross?'disabled':''}" onclick="wToggleRun(${i})">${d}</button>`;
    }).join('');
    const crossBtns=DAYS_S.map((d,i)=>{
      const isSel=i===wizCfg.crossDay,isRun=wizCfg.runDays.includes(i);
      return `<button class="day-btn ${isSel?'cross-sel':isRun?'disabled':''}" onclick="wSetCross(${i})">${d}</button>`;
    }).join('');
    const presets=TARGET_PRESETS.map(t=>`<button class="preset-btn ${wizCfg.goalMin===t.m?'sel':''}" onclick="wSetGoal(${t.m})">${t.l}</button>`).join('');
    body=`
      <div style="margin-bottom:1.1rem">
        <label class="field-label">OBIETTIVO — <span id="wGoalLbl" style="color:var(--accent);font-family:'DM Mono',monospace">${fmtGoal(wizCfg.goalMin)}</span> · MP <span id="wMpLbl" style="color:var(--gold);font-family:'DM Mono',monospace">${fmtPace(Math.round(wizCfg.goalMin*60/42.195))}</span> /km</label>
        <div class="range-row">
          <input type="range" id="wSlider" min="150" max="360" step="1" value="${wizCfg.goalMin}" oninput="wSliderMove(this.value)">
          <span style="font-size:.75rem;color:var(--txt3)">2:30–6:00</span>
        </div>
        <div class="preset-row">${presets}</div>
      </div>
      <div style="margin-bottom:1.1rem">
        <label class="field-label">GIORNI CORSA (seleziona ${p.runs})</label>
        <div class="day-grid">${runDaysBtns}</div>
        ${wizCfg.runDays.length!==p.runs?`<p style="font-size:.72rem;color:#f87171;margin-top:.4rem">Seleziona esattamente ${p.runs} giorni</p>`:''}
      </div>
      <div>
        <label class="field-label">GIORNO CROSS TRAINING</label>
        <div class="day-grid">${crossBtns}</div>
      </div>`;
  }

  if(wizStep===2){
    const weeks=Array.from({length:7},(_,i)=>i+4).map(wi=>{
      const d=addDays(START,wi*7);
      return `<button class="gara-btn ${wizCfg.garaTestWeek===wi?'sel':''}" onclick="wSetGara(${wi})">W${wi+1} · ${fmtD(d)}</button>`;
    }).join('');
    const garaDayBtns=wizCfg.runDays.map(i=>`<button class="day-btn ${wizCfg.garaTestDay===i?'run-sel':''}" onclick="wSetGaraDay(${i})">${DAYS_L[i]}</button>`).join('');
    body=`
      <div style="margin-bottom:1.1rem">
        <label class="field-label">SETTIMANA GARA TEST (mezza maratona)</label>
        <div class="gara-grid">${weeks}</div>
      </div>

        <strong>${wizCfg.name||'—'}</strong> · ${PROFILES_DEF[wizCfg.profileKey].icon} ${PROFILES_DEF[wizCfg.profileKey].name}<br>
        Obiettivo <strong style="color:var(--accent)">${fmtGoal(wizCfg.goalMin)}</strong> · MP <strong style="color:var(--gold);font-family:'DM Mono',monospace">${fmtPace(Math.round(wizCfg.goalMin*60/42.195))} /km</strong><br>
        Corsa: <strong>${wizCfg.runDays.map(d=>DAYS_L[d]).join(', ')}</strong><br>
        Cross: <strong style="color:var(--blue)">${DAYS_L[wizCfg.crossDay]}</strong><br>
        Gara test: <strong style="color:var(--teal)">W${wizCfg.garaTestWeek+1} · ${DAYS_L[wizCfg.garaTestDay]} · ${fmtD(addDays(START,wizCfg.garaTestWeek*7+wizCfg.garaTestDay))}</strong><br>
        Lungo picco: <strong style="color:var(--gold)">${PROFILES_DEF[wizCfg.profileKey].peakLong} km</strong>

  scr.innerHTML=`
    <div style="text-align:center;margin-bottom:1.25rem">
      <div style="font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem">NUOVO ATLETA · PASSO ${wizStep+1}/3</div>
      <h2 style="font-family:'Syne',sans-serif;font-size:1.75rem;font-weight:800">${TITLES[wizStep]}</h2>

function wizValid(){
  if(wizStep===0) return wizCfg.name.trim().length>=2;
  if(wizStep===1){const p=PROFILES_DEF[wizCfg.profileKey];return wizCfg.runDays.length===p.runs;}
  return true;
}
function wizNext(){if(wizValid()){wizStep++;renderWizStep();}}
function wizPrev(){wizStep--;renderWizStep();}
function wizFinish(){
  if(window._editingPid){
    // UPDATE existing profile — preserve log and sessionEdits
    const pid=window._editingPid;
    window._editingPid=null;
    store[pid]={...store[pid],...wizCfg,updatedAt:today()};
    saveStore(store);
    hide('scr-wizard');
    activePid=pid;
    plan=buildPlan({profileKey:store[pid].profileKey||'intermediate',goalMin:store[pid].goalMin||210,
      runDays:store[pid].runDays||[0,2,4,6],crossDay:store[pid].crossDay??1,garaTestWeek:store[pid].garaTestWeek??8,garaTestDay:store[pid].garaTestDay??6});
    zones=calcZones(store[pid].goalMin||210);
    applySessionEdits();
    show('scr-plan');
    renderTopbar();
    renderTab();
    showToast('Impostazioni aggiornate');
  } else {
    // CREATE new profile
    const pid='a_'+Date.now();
    store[pid]={...wizCfg,log:{},sessionEdits:{},createdAt:today()};
    saveStore(store);
    hide('scr-wizard');
    selectProfile(pid);
  }
}
function wSetProfile(k){
  wizCfg.profileKey=k;
  const defaults={beginner:[0,2,5],intermediate:[0,2,4,6],advanced:[0,2,4,5,6],elite:[0,1,2,4,5,6]};
  wizCfg.runDays=defaults[k];
  if(!wizCfg.runDays.includes(wizCfg.garaTestDay)) wizCfg.garaTestDay=wizCfg.runDays[wizCfg.runDays.length-1];
  wizCfg.goalMin=PROFILES_DEF[k].defaultGoal;
  renderWizStep();
}
function wToggleRun(i){
  if(i===wizCfg.crossDay)return;
  const p=PROFILES_DEF[wizCfg.profileKey];
  let rd=[...wizCfg.runDays];
  if(rd.includes(i)){if(rd.length<=1)return;rd=rd.filter(x=>x!==i);}
  else{if(rd.length>=p.runs)rd.shift();rd.push(i);rd.sort((a,b)=>a-b);}
  wizCfg.runDays=rd;
  if(!rd.includes(wizCfg.garaTestDay)) wizCfg.garaTestDay=rd[rd.length-1];
  renderWizStep();
}
function wSetCross(i){if(!wizCfg.runDays.includes(i)){wizCfg.crossDay=i;renderWizStep();}}
function wSetGoal(m){wizCfg.goalMin=m;renderWizStep();}
function wSliderMove(v){
  wizCfg.goalMin=parseInt(v);
  const gl=el('wGoalLbl'),ml=el('wMpLbl');
  if(gl)gl.textContent=fmtGoal(wizCfg.goalMin);
  if(ml)ml.textContent=fmtPace(Math.round(wizCfg.goalMin*60/42.195));
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('sel',parseInt(b.getAttribute('onclick').match(/\d+/)[0])===wizCfg.goalMin));
}
function wSetGara(wi){wizCfg.garaTestWeek=wi;renderWizStep();}
function wSetGaraDay(day){if(wizCfg.runDays.includes(day)){wizCfg.garaTestDay=day;renderWizStep();}}

function applySessionEdits(){
  const edits = store[activePid].sessionEdits || {};
  plan.forEach(week => {
    week.sessions.forEach(session => {
      const k = `w${week.wi}_d${session.day}`;
      const e = edits[k];
      if (!e) return;
      // Apply all edits — including on cells that are rest in the base plan
      if (e.type    !== undefined) session.type    = e.type;
      if (e.km      !== undefined) session.km      = e.km;    else if (e.type==='rest') session.km = undefined;
      if (e.dur     !== undefined) session.dur     = e.dur;
      if (e.desc    !== undefined) session.desc    = e.desc;
      if (e.zone    !== undefined) session.zone    = e.zone;
      if (e.special !== undefined) session.special = e.special;
    });
    week.runKm = getWeekPlanKm(week);
  });
}

function showToast(msg, isErr=false){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
    background:${isErr?'#7f1d1d':'#18181d'};border:1px solid ${isErr?'#f87171':'#2dd4bf'};
    color:${isErr?'#f87171':'#eef0f4'};padding:.7rem 1.25rem;border-radius:8px;font-size:.85rem;
    z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap;`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function stepGoal(delta){
  const p=store[activePid];
  const current=p.goalMin||210;
  const next=Math.min(360,Math.max(150,current+delta));
  updateGoal(next);
}

function toggleGoalPicker(){
  const picker=document.getElementById('goalPicker');
  if(!picker) return;
  picker.classList.toggle('hidden');
  if(!picker.classList.contains('hidden')){
    // mark active preset
    const cur=store[activePid]?.goalMin||210;
    picker.querySelectorAll('.goal-preset-btn').forEach(b=>{
      const m=parseInt(b.getAttribute('onclick').match(/\d+/)[0]);
      b.classList.toggle('active', m===cur);
    });
    // close on outside click
    setTimeout(()=>document.addEventListener('click',closeGoalPickerOutside,{once:true}),10);
  }
}

function closeGoalPickerOutside(e){
  const picker=document.getElementById('goalPicker');
  if(picker && !picker.contains(e.target)) picker.classList.add('hidden');
}

function pickGoal(m){
  updateGoal(m);
  const picker=document.getElementById('goalPicker');
  if(picker) picker.classList.add('hidden');
}

function updateGoal(v){
  const g=parseInt(v);
  store[activePid].goalMin=g;
  saveStore(store);
  zones=calcZones(g);
  const tg=el('topGoal'); if(tg) tg.textContent=fmtGoal(g);
  // Update zone chips
  const zz=zones;
  const chipsEl=el('zoneChips');
  if(chipsEl) chipsEl.innerHTML=[
    {l:'MP',z:'mp',c:'#fbbf24'},{l:'Soglia',z:'threshold',c:'#fbbf24'},
    {l:'Rep',z:'rep',c:'#a78bfa'},{l:'Facile',z:'easy',c:'#34d399'}
  ].map(({l,z,c})=>`<span class="zchip" style="border-color:${c}44;color:${c};background:${c}11">${l}: ${fmtPace(zz[z].lo)}–${fmtPace(zz[z].hi)}</span>`).join('');
  // Update all pace displays in plan
  document.querySelectorAll('[data-zone]').forEach(node=>{
    const zone=node.dataset.zone;
    if(zones[zone]) node.textContent=paceStr(zones,zone);
  });
  // Update pace table
  ['easy','longEasy','mp','threshold','rep'].forEach(zone=>{
    const node=document.getElementById('tz-'+zone);
    if(node&&zones[zone]) node.textContent=paceStr(zones,zone);
  });
}

function switchTab(t){
  activeTab=t;
  renderTab();
  // Re-render topbar tabs
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active',b.getAttribute('onclick').includes(`'${t}'`));
  });
}

function setActiveTabVisibility(){
  ['plan','dashboard','history','compare'].forEach(tab=>{
    const node=document.getElementById('tab-'+tab);
    if(node) node.classList.toggle('hidden',tab!==activeTab);
  });
}

function renderTab(){
  setActiveTabVisibility();
  if(activeTab==='plan')      renderPlan();
  if(activeTab==='dashboard') renderDashboard();
  if(activeTab==='history')   renderHistory();
  if(activeTab==='compare')   renderCompare();
}

// ─── PLAN TAB ───
let garminSelectedWeeks = new Set(['all']);
let weeklyLoadFiltersByPid = {};

function renderPlan(){
  show('tab-plan'); hide('tab-dashboard'); hide('tab-history');
  const cont=el('planWeeks');
  const phases=[
    {name:'Base Aerobica',    badge:'Fase 1', weeks:[0,1,2,3]},
    {name:'Sviluppo Specifico',badge:'Fase 2',weeks:[4,5,6,7,8]},
    {name:'Picco & Taper',   badge:'Fase 3', weeks:[9,10,11,12,13]},
  ];
  const totalKm=getPlanTotalKm();
  cont.innerHTML=`<div class="plan-total-bar"><span class="plan-total-label">Km totali pianificati</span><strong class="plan-total-value">${formatPlanKm(totalKm)} km</strong></div>`+renderWeeklyLoadChart()+phases.map(ph=>`
    <div class="phase-hdr">
      <span class="phase-badge">${ph.badge}</span>
      <span class="phase-name">${ph.name}</span>
    </div>
    ${ph.weeks.map(wi=>renderWeekCard(wi)).join('')}
  `).join('')+renderPaceTable()+renderGarminPanel();
  addWeekCardListeners();
}

function getPlanTotalKm(){
  return plan.reduce((total,week)=>total+getWeekPlanKm(week),0);
}

function getWeekPlanKm(week){
  return week.sessions.reduce((sum,session)=>sum+(session.km||0),0);
}

function formatPlanKm(km){
  return Number.isInteger(km)?String(km):km.toFixed(1).replace('.',',');
}

function getWeeklyLoadTypes(){
  const all=['easy','cross','medio','lungo','rep','test','race'];
  if(!activePid)return all;
  if(!weeklyLoadFiltersByPid[activePid]) weeklyLoadFiltersByPid[activePid]=new Set(all);
  return weeklyLoadFiltersByPid[activePid];
}

function toggleWeeklyLoadFilter(type){
  const filters=getWeeklyLoadTypes();
  if(filters.has(type)){
    if(filters.size===1){showToast('Mantieni almeno un tipo attivo',true);return;}
    filters.delete(type);
  } else filters.add(type);
  renderPlan();
}

function resetWeeklyLoadFilters(){
  weeklyLoadFiltersByPid[activePid]=new Set(['easy','cross','medio','lungo','rep','test','race']);
  renderPlan();
}

function renderWeeklyLoadChart(){
  const typeColors={easy:'#58A77A',cross:'#4E91A6',medio:'#C59A4A',lungo:'#B96C7A',rep:'#8875A8',test:'#3D9993',race:'#D4654C'};
  const typeLabels={easy:'Facile',cross:'Cross',medio:'Medio',lungo:'Lungo',rep:'Ripetute',test:'Gara test',race:'Gara'};
  const typeOrder=['easy','cross','medio','lungo','rep','test','race'];
  const activeTypes=getWeeklyLoadTypes();
  const filteredWeekKm=week=>week.sessions.reduce((sum,session)=>sum+(activeTypes.has(session.type)?(session.km||0):0),0);
  const maxKm=Math.max(...plan.map(filteredWeekKm),1);
  const bars=plan.map(week=>{
    const km=filteredWeekKm(week);
    const height=Math.max(km/maxKm*112,3);
    const totals=typeOrder.reduce((result,type)=>{
      result[type]=week.sessions.filter(session=>session.type===type).reduce((sum,session)=>sum+(session.km||0),0);
      return result;
    },{});
    const segments=typeOrder.filter(type=>activeTypes.has(type)&&totals[type]>0).map(type=>
      `<div class="weekly-load-segment" style="height:${totals[type]/maxKm*112}px;background:${typeColors[type]}" title="${typeLabels[type]}: ${formatPlanKm(totals[type])} km"></div>`
    ).join('');
    const breakdown=typeOrder.filter(type=>activeTypes.has(type)&&totals[type]>0).map(type=>`${typeLabels[type]} ${formatPlanKm(totals[type])} km`).join(' · ');
    return `<div class="weekly-load-col" title="${week.label}: ${formatPlanKm(km)} km">
      <span class="weekly-load-value">${formatPlanKm(km)}</span>
      <div class="weekly-load-stack" style="height:${height}px" title="${breakdown}">${segments}</div>
      <span class="weekly-load-label">${week.label}</span>
    </div>`;
  }).join('');
  const filters=typeOrder.map(type=>`<button class="weekly-load-filter-btn ${activeTypes.has(type)?'active':''}" style="--filter-color:${typeColors[type]}" onclick="toggleWeeklyLoadFilter('${type}')">
    <i class="weekly-load-filter-dot"></i>${typeLabels[type]}</button>`).join('');
  return `<div class="weekly-load-chart">
    <div class="weekly-load-title">Carico settimanale · km filtrati</div>
    <div class="weekly-load-legend">
      ${typeOrder.map(type=>`<span><i style="background:${typeColors[type]}"></i>${typeLabels[type]}</span>`).join('')}
    </div>
    <div class="weekly-load-scroll-wrap">
      <div class="weekly-load-layout">
        <div class="weekly-load-bars">${bars}</div>
        <div class="weekly-load-filter-panel">
          <div class="weekly-load-filter-title">Filtra allenamenti</div>
          ${filters}
          <button class="weekly-load-reset" onclick="resetWeeklyLoadFilters()">Mostra tutti</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderWeekCard(wi){
  const week=plan[wi];
  const isCur=wi===currentWeekIdx();
  const log=store[activePid].log||{};
  const wS=week.sessions.filter(s=>s.type!=='rest');
  const dots=wS.map(s=>{
    const k=`w${wi}_d${s.day}`;
    const lg=log[k];
    const col=!lg?'#2a2a35':lg.completed?'#34d399':'#f87171';
    return `<div class="adh-dot" style="background:${col}"></div>`;
  }).join('');
  const tagClass={'race':'wtag-g','gara':'wtag-g','picco':'wtag-p','scarico':'wtag-r','carico':'wtag-c'}[week.tag]||'wtag-c';
  const tagLabel={'race':'🏅 Gara','gara':'Gara Test','picco':'Picco','scarico':'Scarico','carico':'Carico'}[week.tag]||week.tag;
  const isOpen=expandedWeek===wi;
  const cls=`week-card${isCur?' current-week':''}${week.isPeak?' peak-week':''}${week.isRest?' rest-week':''}`;
  const sessHtml=week.sessions.map(s=>renderSessionCell(s,wi)).join('');
  const cols=week.sessions.length;
  return `
  <div class="${cls}" id="wcard-${wi}">
    <div class="week-hdr ${isOpen?'open':''}" id="whdr-${wi}" data-wi="${wi}">
      <span class="week-n">${week.label}</span>
      ${isCur?`<span class="week-badge">QUESTA SETTIMANA</span>`:''}
      <span class="week-dates">${week.dateRange}</span>
      <div class="adh-dots">${dots}</div>
      <span class="week-km">~${formatPlanKm(getWeekPlanKm(week))}km</span>
      <span class="wtag ${tagClass}">${tagLabel}</span>
      <span class="chevron ${isOpen?'open':''}">▼</span>
    </div>
    <div id="wsess-${wi}" class="${isOpen?'':'hidden'}">
      <div class="sessions-row" style="grid-template-columns:repeat(${cols},1fr)">${sessHtml}</div>
    </div>
  </div>`;
}

function renderSessionCell(s,wi){
  const log=store[activePid].log||{};
  const key=`w${wi}_d${s.day}`;
  const lg=log[key];
  const sm=SESS_META[s.type]||SESS_META.easy;
  if(s.type==='rest') return `<div class="rest-cell">Riposo</div>`;
  const loggedCls=lg?(lg.completed?'logged-ok':'logged-skip'):'';
  const badge=lg?(lg.completed?'✅':'⏭️'):'';
  const lData=lg&&lg.completed?`
    <div class="s-log-data">
      ${lg.km?`<span class="s-log-chip" style="color:#34d399">📏${lg.km}km</span>`:''}
      ${lg.pace?`<span class="s-log-chip mono" style="color:#f5c842">⏱${lg.pace}</span>`:''}
      ${lg.hr?`<span class="s-log-chip" style="color:#fb7185">❤️${lg.hr}</span>`:''}
      ${lg.feel?`<span class="s-log-chip">${FEEL[lg.feel-1]}</span>`:''}
    </div>`:'';
  const paceHtml=s.type==='cross'
    ? `<span class="s-pace" style="color:var(--cross)">${s.pace||'FC 65–78%'}</span>`
    : s.zone?`<span class="s-pace" data-zone="${s.zone}">${paceStr(zones,s.zone)}</span>`:'';
  const kmHtml=s.type==='cross'
    ? `${s.km?`<div class="s-km">${s.km} km</div>`:''}<div class="s-cross-dur">${s.dur||50}'</div>`
    : `<div class="s-km">${s.km===42.195?'42.2':s.km} km</div>`;
  const p=store[activePid];
  const hasEdit=p.sessionEdits&&p.sessionEdits[`w${wi}_d${s.day}`];
  const sessDate=addDays(START,wi*7+s.day);
  const sessDateStr=`${sessDate.getDate()}/${sessDate.getMonth()+1}`;
  return `
  <div class="session ${loggedCls}${hasEdit?' has-edits':''}" onclick="openSessionAction('${key}',${wi},${s.day})">
    <div class="s-status-badge">${badge}</div>
    <div class="s-day">${s.dayName} <span class="s-date">${sessDateStr}</span></div>
    <div class="s-type">
      <div class="s-type-dot" style="background:${sm.color}"></div>
      <span class="s-type-lbl" style="color:${sm.color}">${s.special||sm.label}</span>
    </div>
    ${kmHtml}
    <div class="s-desc">${s.desc}</div>
    ${paceHtml}
    ${lData}
    ${hasEdit?'<div class="edit-indicator">✏ modificata</div>':''}
    ${!lg&&!hasEdit?'<div class="s-cta">clicca per registrare →</div>':''}
  </div>`;
}
