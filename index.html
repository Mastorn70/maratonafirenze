// One-time delegated listener — set up once, handles all week headers
let _weekListenerReady=false;
function addWeekCardListeners(){
  if(_weekListenerReady) return;
  _weekListenerReady=true;
  document.getElementById('planWeeks').addEventListener('click',e=>{
    const hdr=e.target.closest('[id^="whdr-"]');
    if(!hdr) return;
    // Don't toggle if click came from inside a session cell
    if(e.target.closest('.session,.rest-cell')) return;
    const wi=parseInt(hdr.dataset.wi);
    const wasOpen=expandedWeek===wi;
    expandedWeek=wasOpen?-1:wi;
    const sessDiv=document.getElementById(`wsess-${wi}`);
    const chev=hdr.querySelector('.chevron');
    if(sessDiv){sessDiv.classList.toggle('hidden',wasOpen);hdr.classList.toggle('open',!wasOpen);}
    if(chev){chev.classList.toggle('open',!wasOpen);}
  });
}

// ─── DASHBOARD TAB ───
function renderDashboard(){
  hide('tab-plan'); show('tab-dashboard'); hide('tab-history');
  const p=store[activePid];
  const log=p.log||{};
  const pd=PROFILES_DEF[p.profileKey||'intermediate'];
  const zz=calcZones(p.goalMin||210);
  const allS=plan.flatMap(w=>w.sessions).filter(s=>s.type!=='rest');
  const entries=Object.values(log);
  const completed=entries.filter(e=>e.completed);
  const skipped=entries.filter(e=>!e.completed);
  const totalKm=completed.reduce((a,e)=>a+(parseFloat(e.km)||0),0);
  const adh=allS.length?Math.round(entries.length/allS.length*100):0;
  const feels=completed.filter(e=>e.feel).map(e=>e.feel);
  const avgFeel=feels.length?(feels.reduce((a,b)=>a+b,0)/feels.length).toFixed(1):'—';
  const paces=completed.filter(e=>e.pace).map(e=>{
    const [m,s]=(e.pace||'').split(':').map(Number);return m*60+(s||0);}).filter(Boolean);
  const bestPace=paces.length?fmtPace(Math.min(...paces)):'—';

  const statCards=[
    {label:'Aderenza Piano',val:`${adh}%`,sub:`${entries.length}/${allS.length} sessioni`,ring:adh,color:pd.color},
    {label:'Km Totalizzati', val:Math.round(totalKm)+'',sub:'km corsi finora',ring:null},
    {label:'Sessioni Completate',val:completed.length+'',sub:`${skipped.length} saltate`,ring:null},
    {label:'Sensazione Media',val:avgFeel,sub:'su scala 1–5',ring:null},
    {label:'Miglior Ritmo',  val:bestPace,sub:'min/km (miglior corsa)',ring:null,mono:true},
    {label:'Ritmo MP Attuale',val:fmtPace(zz.mp.lo),sub:fmtGoal(p.goalMin||210)+' obiettivo',ring:null,mono:true,color:'#ff5c35'},
  ].map(s=>`
    <div class="stat-card">
      ${s.ring!==null?buildRing(s.ring,22,3.5,s.color||'#38bdf8',s.ring+'%'):'<div style="width:44px"></div>'}
      <div>
        <div class="stat-lbl">${s.label}</div>
        <div class="stat-val ${s.mono?'mono':''}" style="color:${s.color||'var(--txt)'}">${s.val}</div>
        <div class="stat-sub">${s.sub}</div>
      </div>
    </div>`).join('');

  // Weekly adherence bars
  const bars=plan.map(week=>{
    const wS=week.sessions.filter(s=>s.type!=='rest');
    const wL=wS.filter(s=>!!log[`w${week.wi}_d${s.day}`]);
    const pct=wS.length?wL.length/wS.length:0;
    const isCur=week.wi===currentWeekIdx();
    return `<div class="adh-bar-wrap">
      <div class="adh-bar" style="background:${pct>0?'#ff5c35':'#1e1e28'};height:${Math.max(pct*64,2)}px;opacity:${pct===0?0.3:1};${isCur?'box-shadow:0 0 6px #ff5c35':''}"></div>
      <span class="adh-bar-lbl" style="color:${isCur?'#ff5c35':'#3a3a4a'}">${week.label}</span>
    </div>`;
  }).join('');

  el('dashContent').innerHTML=`
    <h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:1.25rem">Statistiche · ${p.name}</h2>
    <div class="stats-grid">${statCards}</div>
    <div class="adh-chart">
      <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--txt3)">Aderenza per Settimana</div>
      <div class="adh-chart-bars">${bars}</div>
    </div>`;
}

// ─── HISTORY TAB ───
function renderHistory(){
  hide('tab-plan'); hide('tab-dashboard'); show('tab-history');
  const log=store[activePid].log||{};
  const entries=Object.entries(log).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!entries.length){
    el('histContent').innerHTML=`<h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:1.5rem">Diario Allenamenti</h2>
      <div class="empty-state"><div class="empty-icon">📋</div>Nessun allenamento registrato ancora.<br>Clicca su una sessione nel piano per iniziare.</div>`;
    return;
  }
  const items=entries.map(([key,entry])=>{
    const m=key.match(/w(\d+)_d(\d+)/);
    if(!m)return '';
    const wi=parseInt(m[1]),day=parseInt(m[2]);
    const week=plan[wi];
    const session=week?.sessions.find(s=>s.day===day);
    if(!session)return '';
    const sm=SESS_META[session.type]||SESS_META.easy;
    const dt=entry.date?new Date(entry.date).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}):'';
    return `<div class="log-entry" onclick="openLog('${key}',${wi},${day})">
      <div class="log-icon">${entry.completed?'✅':'⏭️'}</div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem">
          <span style="font-size:.8rem;font-weight:700;color:${sm.color}">${sm.label}</span>
          <span style="font-size:.72rem;color:var(--txt3)">W${wi+1} · ${DAYS_L[day]}</span>
        </div>
        <div class="log-meta">
          ${dt?`<span class="log-chip">📅 ${dt}</span>`:''}
          ${entry.km?`<span class="log-chip">📏 ${entry.km} km</span>`:''}
          ${entry.pace?`<span class="log-chip mono">⏱ ${entry.pace} /km</span>`:''}
          ${entry.hr?`<span class="log-chip">❤️ ${entry.hr} bpm</span>`:''}
          ${entry.feel?`<span class="log-chip">${FEEL[entry.feel-1]}</span>`:''}
        </div>
        ${entry.note?`<div class="log-note">${entry.note}</div>`:''}
      </div>
      <button class="log-del" onclick="event.stopPropagation();deleteLog('${key}')">🗑</button>
    </div>`;
  }).join('');
  el('histContent').innerHTML=`<h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:1.25rem">Diario Allenamenti</h2><div class="log-list">${items}</div>`;
}

// ─── LOG MODAL ───
function openLog(key,wi,day){
  const week=plan[wi];
  const session=week?.sessions.find(s=>s.day===day);
  if(!session||session.type==='rest')return;
  const log=store[activePid].log||{};
  const existing=log[key]||null;
  const sm=SESS_META[session.type]||SESS_META.easy;
  const feel=existing?.feel||3;

  const feelBtns=[1,2,3,4,5].map(v=>`
    <button class="feel-btn ${feel===v?'sel':''}" onclick="setFeel(${v})">${FEEL[v-1]}</button>`).join('');

  el('modalBox').innerHTML=`
    <div class="modal-header">
      <div>
        <div style="font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:${sm.color};margin-bottom:.2rem">${sm.label}</div>
        <div style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800">Registra allenamento</div>
        <div style="font-size:.78rem;color:var(--txt3)">W${wi+1} · ${DAYS_L[day]}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <label class="check-row" style="margin-bottom:1rem">
      <input type="checkbox" id="mCompleted" ${existing?.completed!==false?'checked':''} onchange="toggleCompleted(this.checked)">
      <span>Allenamento completato</span>
    </label>

    <div id="mCompletedFields" class="${existing?.completed===false?'hidden':''}">
      <div class="form-grid" style="margin-bottom:.75rem">
        <div><label class="field-label">Data</label>
          <input class="text-input" type="date" id="mDate" value="${existing?.date||today()}"></div>
        <div><label class="field-label">Km percorsi</label>
          <input class="text-input" type="number" id="mKm" value="${existing?.km||''}" placeholder="${session.km||''}"></div>
        <div><label class="field-label">Ritmo medio (mm:ss)</label>
          <input class="text-input" type="text" id="mPace" value="${existing?.pace||''}" placeholder="5:10"></div>
        <div><label class="field-label">FC media (bpm)</label>
          <input class="text-input" type="number" id="mHr" value="${existing?.hr||''}" placeholder="148"></div>
      </div>
      <div style="margin-bottom:.75rem">
        <label class="field-label">SENSAZIONE — <span id="feelLabel">${FEEL[feel-1]}</span></label>
        <div class="feel-row" id="feelRow">${feelBtns}</div>
      </div>
    </div>

    <div id="mSkipField" class="${existing?.completed!==false?'hidden':''}">
      <label class="field-label">MOTIVO SALTO (opzionale)</label>
    </div>

    <div>
      <label class="field-label">NOTE</label>
      <textarea class="text-input" id="mNote" rows="2" placeholder="Sensazioni, meteo, ecc.">${existing?.note||''}</textarea>
    </div>

    <div class="modal-actions">
      ${existing?`<button class="modal-btn danger" onclick="deleteLog('${key}')">Elimina</button>`:''}
      <button class="modal-btn cancel" onclick="closeModal()">Annulla</button>
      <button class="modal-btn save" onclick="saveLog('${key}',${wi},${day})">Salva</button>
    </div>`;

  window._modalKey=key; window._modalWi=wi; window._modalDay=day;
  window._currentFeel=feel;
  el('modal').classList.remove('hidden');
}

function downloadJSON(data, filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadText(text,filename,type='text/plain;charset=utf-8'){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportAllJSON(){
  const ts=new Date().toISOString().slice(0,10);
  downloadJSON({
    _meta:{app:'Maratona Firenze',version:2,exportedAt:new Date().toISOString(),totalAthletes:Object.keys(store).length},
    athletes:store
  }, `maratona-firenze-tutti-${ts}.json`);
}

function bytesToBase64(bytes){
  let binary='';
  bytes.forEach(byte=>binary+=String.fromCharCode(byte));
  return btoa(binary);
}

function base64ToBytes(value){
  const binary=atob(value);
  return Uint8Array.from(binary,char=>char.charCodeAt(0));
}

async function deriveBackupKey(password,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

async function exportSecureBackup(){
  if(!Object.keys(store).length){showToast('Nessun profilo da salvare',true);return;}
  const password=prompt('Inserisci una password per cifrare il backup:');
  if(!password)return;
  const confirmPassword=prompt('Ripeti la password:');
  if(password!==confirmPassword){showToast('❌ Le password non coincidono',true);return;}
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveBackupKey(password,salt);
    const payload=JSON.stringify({_meta:{app:'Maratona Firenze',version:2,exportedAt:new Date().toISOString()},athletes:store});
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(payload));
    const backup={_encrypted:true,algorithm:'AES-GCM',kdf:'PBKDF2-SHA-256',iterations:150000,salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(new Uint8Array(encrypted))};
    const ts=new Date().toISOString().slice(0,10);
    downloadJSON(backup,`maratona-firenze-backup-${ts}.mfbackup`);
    showToast('🔐 Backup cifrato scaricato');
  }catch(err){showToast('❌ Impossibile creare il backup protetto',true);}
}

function exportOneJSON(){
  if(!activePid)return;
  const p=store[activePid];
  const ts=new Date().toISOString().slice(0,10);
  const safeName=(p.name||'atleta').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  downloadJSON({
    _meta:{app:'Maratona Firenze',version:2,exportedAt:new Date().toISOString(),athleteId:activePid},
    athlete:p
  }, `maratona-${safeName}-${ts}.json`);
}

function importAllJSON(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      let data=JSON.parse(e.target.result);
      if(data._encrypted){
        const password=prompt('Inserisci la password del backup:');
        if(!password){input.value='';return;}
        const salt=base64ToBytes(data.salt),iv=base64ToBytes(data.iv);
        const key=await deriveBackupKey(password,salt);
        const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,base64ToBytes(data.data));
        data=JSON.parse(new TextDecoder().decode(decrypted));
      }
      const athletes=data.athletes||data; // support both formats
      // Merge: new athletes added, existing by pid updated
      let imported=0;
      Object.entries(athletes).forEach(([pid,p])=>{
        if(pid.startsWith('_'))return;
        if(p&&p.name){store[pid]=p;imported++;}
      });
      saveStore(store);
      input.value='';
      showToast(`✅ ${imported} profil${imported===1?'o':'i'} importat${imported===1?'o':'i'}`);
      renderProfiles();
    }catch(err){
      input.value='';
      showToast('❌ File JSON non valido',true);
    }
  };
  reader.readAsText(file);
}

function importOneJSON(input){
  const file=input.files[0];
  if(!file||!activePid)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const p=data.athlete||data;
      if(!p||!p.name) throw new Error('no name');
      // Confirm before overwriting
      if(!confirm(`Sostituire il profilo attuale di "${store[activePid].name}" con "${p.name}" dal file?\n\nAttenzione: i dati attuali verranno sovrascritti.`)){
        input.value='';return;
      }
      store[activePid]={...p};
      saveStore(store);
      input.value='';
      plan=buildPlan({profileKey:p.profileKey||'intermediate',goalMin:p.goalMin||210,
        runDays:p.runDays||[0,2,4,6],crossDay:p.crossDay??1,garaTestWeek:p.garaTestWeek??8,garaTestDay:p.garaTestDay??6});
      zones=calcZones(p.goalMin||210);
      renderTopbar();
      renderTab();
      showToast(`✅ Profilo "${p.name}" importato`);
    }catch(err){
      input.value='';
      showToast('❌ File JSON non valido',true);
    }
  };
  reader.readAsText(file);
}

function setEditType(type, edKey){
  // Update button styles
  document.querySelectorAll('.etype-btn').forEach(b=>{
    const t=b.getAttribute('onclick').match(/'([^']+)'/)[1];
    const m=SESS_META[t]||SESS_META.easy;
    b.classList.toggle('sel',t===type);
    b.style.borderColor=t===type?m.color:'';
    b.style.color=t===type?m.color:'';
    b.style.background=t===type?m.color+'18':'';
  });
  const isCross=type==='cross';
  const isRest=type==='rest';
  const runF=el('editRunFields'),crossF=el('editCrossFields');
  if(runF)  runF.style.display=isCross||isRest?'none':'';
  if(crossF)crossF.style.display=isCross?'':'none';
  window._editType=type;
}

function saveSessionEdit(edKey,wi,day){
  const type=window._editType||(document.querySelector('.etype-btn.sel')?.getAttribute('onclick').match(/'([^']+)'/)?.[1])||'easy';
  const edit={
    type,
    km:      type==='rest' ? undefined : parseFloat(el('editKm')?.value)||undefined,
    dur:     type==='cross' ? parseInt(el('editDur')?.value)||50 : undefined,
    desc:    el('editDesc')?.value||'',
    zone:    el('editZone')?.value||'easy',
    special: el('editSpecial')?.value||'',
    editedAt:today(),
  };
  // Remove undefined
  Object.keys(edit).forEach(k=>edit[k]===undefined&&delete edit[k]);
  store[activePid].sessionEdits=store[activePid].sessionEdits||{};
  store[activePid].sessionEdits[edKey]=edit;
  saveStore(store);
  // Rebuild plan applying edits
  applySessionEdits();
  closeModal();
  renderTab();
  showToast('✅ Sessione modificata e salvata');
}

function resetSessionEdit(edKey){
  if(!store[activePid].sessionEdits)return;
  delete store[activePid].sessionEdits[edKey];
  saveStore(store);
  applySessionEdits();
  closeModal();
  renderTab();
  showToast('↺ Sessione ripristinata all\'originale');
}


// ═══════════════════════════════════════════════════════════════
// FULL-PAGE PLAN EDITOR
// ═══════════════════════════════════════════════════════════════
let edSelectedCell = null; // {wi, day}
let edSelectedCells = []; // [{wi, day}]
let edDragType     = null; // type being dragged from palette
let edStagedEdits  = {};   // pending edits, cloned from store on open

function openEditor() {
  // Clone current edits so changes are staged until Save
  const p = store[activePid];
  edStagedEdits = JSON.parse(JSON.stringify(p.sessionEdits || {}));
  edSelectedCell = null;
  edSelectedCells = [];

  // Rebuild plan freshly then apply staged edits
  rebuildEditorPlan();

  el('edTitle').textContent = `✏ Modifica Piano — ${p.name}`;
  hide('scr-plan');
  const scr = document.getElementById('scr-editor');
  scr.classList.add('visible');
  renderEditorGrid();
  renderPalette();
  renderEditorPanel(null);
}

function closeEditor() {
  document.getElementById('scr-editor').classList.remove('visible');
  show('scr-plan');
}

function saveEditorAndClose() {
  store[activePid].sessionEdits = JSON.parse(JSON.stringify(edStagedEdits));
  saveStore(store);
  applySessionEdits();
  closeEditor();
  renderTab();
  showToast('✅ Piano salvato');
}

function resetAllEdits() {
  if (!confirm('Ripristinare tutte le sessioni ai valori originali del piano?')) return;
  edStagedEdits = {};
  rebuildEditorPlan();
  renderEditorGrid();
  renderEditorPanel(null);
  showToast('↺ Piano ripristinato');
}

function rebuildEditorPlan() {
  const p = store[activePid];
  plan = buildPlan({
    profileKey:   p.profileKey   || 'intermediate',
    goalMin:      p.goalMin      || 210,
    runDays:      p.runDays      || [0,2,4,6],
    crossDay:     p.crossDay     ?? 1,
    garaTestWeek: p.garaTestWeek ?? 8,
    garaTestDay:  p.garaTestDay  ?? 6,
  });
  zones = calcZones(p.goalMin || 210);

  // Apply ALL staged edits — including on rest cells (moved sessions)
  plan.forEach(week => {
    week.sessions.forEach(session => {
      const k = `w${week.wi}_d${session.day}`;
      const e = edStagedEdits[k];
      if (!e) return;
      // Apply every field that is set in the edit
      if (e.type    !== undefined) session.type    = e.type;
      if (e.km      !== undefined) session.km      = e.km;       else if (e.type==='rest') session.km = undefined;
      if (e.dur     !== undefined) session.dur     = e.dur;
      if (e.desc    !== undefined) session.desc    = e.desc;
      if (e.zone    !== undefined) session.zone    = e.zone;
      if (e.special !== undefined) session.special = e.special;
    });
    week.runKm = getWeekPlanKm(week);
  });
}

    {type:'lungo',sub:'lungo'},
    {type:'cross',sub:'cross training'},
    {type:'test', sub:'mezza test'},

// ── SELECT CELL ──
function edSelectCell(wi, day, event) {
  const key=`${wi}_${day}`;
  if(event?.ctrlKey||event?.metaKey){
    const index=edSelectedCells.findIndex(cell=>`${cell.wi}_${cell.day}`===key);
    if(index>=0) edSelectedCells.splice(index,1);
    else edSelectedCells.push({wi,day});
  } else {
    edSelectedCells=[{wi,day}];

  edSelectedCell=edSelectedCells[edSelectedCells.length-1]||null;
  renderEditorGrid();
  const week = plan[wi];
  const session = week?.sessions.find(s => s.day === day);
  renderEditorPanel(session, wi, day, edSelectedCells.length);
}

// ── EDIT HELPERS ──
function edGetOrCreateEdit(wi, day) {
  const k = `w${wi}_d${day}`;
  if (!edStagedEdits[k]) {
    const session = plan[wi]?.sessions.find(s => s.day === day);
    edStagedEdits[k] = {
      type:    session?.type,
      km:      session?.km,
      dur:     session?.dur,
      desc:    session?.desc,
      zone:    session?.zone,
      special: session?.special || '',
    };
  }
  return edStagedEdits[`w${wi}_d${day}`];
}

function edSetType(wi, day, type) {
  edApplyToSelection(wi,day,e=>{
    e.type = type;
    if (type === 'cross') e.dur = e.dur || 50;
    if (type === 'rest') { e.km = undefined; e.dur = undefined; }
    const zoneMap = {easy:'easy',rep:'rep',medio:'threshold',lungo:'longMP',test:'halfTest',race:'race'};
    if (!e.zone && zoneMap[type]) e.zone = zoneMap[type];
  });
}

function edSetKm(wi, day, v) {
  edApplyToSelection(wi,day,e=>{ e.km = parseFloat(v) || undefined; });
}
function edSetDur(wi, day, v) {
  edApplyToSelection(wi,day,e=>{ e.dur = parseInt(v) || 50; });
}
function edSetZone(wi, day, v) {
  edApplyToSelection(wi,day,e=>{ e.zone = v; });
}
function edSetDesc(wi, day, v) {
  edApplyToSelection(wi,day,e=>{ e.desc = v; });
}
function edSetSpecial(wi, day, v) {
  edApplyToSelection(wi,day,e=>{ e.special = v; });
}

function adjustKm(delta) {
  if (!edSelectedCells.length) { showToast('Seleziona prima una sessione',true); return; }
  edApplyToSelection(null,null,e=>{
    const session=plan[e._wi]?.sessions.find(s=>s.day===e._day);
    if (!session || session.type === 'rest' || session.type === 'cross') return;
    e.km=Math.max(1,Math.round(((e.km||session.km||10)+delta)*2)/2);
  });
}

function edApplyToSelection(wi, day, mutate) {
  const targets=edSelectedCells.length?edSelectedCells:[{wi,day}];
  targets.forEach(target=>{
    const edit=edGetOrCreateEdit(target.wi,target.day);
    edit._wi=target.wi; edit._day=target.day;
    mutate(edit);
    delete edit._wi; delete edit._day;
    edStagedEdits[`w${target.wi}_d${target.day}`]=edit;
  });
  rebuildEditorPlan();
  renderEditorGrid();
  const current=edSelectedCell||targets[targets.length-1];
  const session=plan[current.wi]?.sessions.find(s=>s.day===current.day);
  if(session) renderEditorPanel(session,current.wi,current.day,edSelectedCells.length);
}

function edSaveAndRefresh(wi, day) {
  showToast('Modifica applicata · Premi Salva per confermare tutto');
}

function quickReset(wi, day) {
  const k = `w${wi}_d${day}`;
  delete edStagedEdits[k];
  rebuildEditorPlan();
  renderEditorGrid();
  if (edSelectedCell?.wi === wi && edSelectedCell?.day === day) {
    const session = plan[wi]?.sessions.find(s => s.day === day);
    renderEditorPanel(session, wi, day);
  }
}

function paletteDragStart(type) {

  });
}
function paletteDragEnd() {
  edDragType = null;
  document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('dragging'));
}
function applyTypeFromPalette(type) {

  edSetType(edSelectedCells[0].wi, edSelectedCells[0].day, type);

// ── CELL-TO-CELL DRAG (swap or copy) ──
let edDragCell = null; // {wi, day} — cell being dragged

function cellDragStart(e, wi, day) {
  edDragCell = { wi, day };
  edDragType = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', `${wi},${day}`);
  // Mark source cell after a tick so it renders before becoming transparent
  setTimeout(() => {
    const src = document.querySelector(`.ed-cell[data-wi="${wi}"][data-day="${day}"]`);
    if (src) src.classList.add('drag-src');
  }, 0);
}

function cellDragEnd(e) {
  document.querySelectorAll('.ed-cell').forEach(c => c.classList.remove('drag-src','drag-over-swap','drag-over'));
  edDragCell = null;
}

function edDragOver(e, wi, day) {
  e.preventDefault();
  const cell = e.currentTarget;
  if (edDragCell) {
    // cell-to-cell: show swap indicator
    if (edDragCell.wi === wi && edDragCell.day === day) return;
    e.dataTransfer.dropEffect = 'move';
    cell.classList.add('drag-over-swap');
  } else if (edDragType) {
    e.dataTransfer.dropEffect = 'copy';
    cell.classList.add('drag-over');
  }
}

function edDragLeave(e) {
  e.currentTarget.classList.remove('drag-over','drag-over-swap');
}

function edDrop(e, wi, day) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over','drag-over-swap');

  if (edDragCell) {
    // ── SWAP two cells ──
    const src = edDragCell;
    if (src.wi === wi && src.day === day) return;
    swapCells(src.wi, src.day, wi, day);
    edDragCell = null;
    return;
  }
  if (edDragType) {
    edSelectedCells = [{wi,day}];
    edSelectedCell = { wi, day };
    edSetType(wi, day, edDragType);
    edDragType = null;
  }
}

function swapCells(wi1, d1, wi2, d2) {
  const k1 = `w${wi1}_d${d1}`;
  const k2 = `w${wi2}_d${d2}`;

  // Snapshot the current effective state of a cell (edit overlay → original plan → rest fallback)
  function snapshot(wi, day) {
    const session = plan[wi]?.sessions.find(s => s.day === day);
    const edit    = edStagedEdits[`w${wi}_d${day}`];
    if (!session) return { type:'rest' };
    return {
      type:    edit?.type    ?? session.type,
      km:      edit?.km      ?? session.km      ?? undefined,
      dur:     edit?.dur     ?? session.dur      ?? undefined,
      desc:    edit?.desc    ?? session.desc     ?? '',
      zone:    edit?.zone    ?? session.zone     ?? 'easy',
      special: edit?.special ?? session.special  ?? '',
    };
  }

  const snap1 = snapshot(wi1, d1);
  const snap2 = snapshot(wi2, d2);

  // Write each snapshot into the OTHER cell's edit slot
  // If a snapshot is rest, we store {type:'rest'} which blanks the cell
  edStagedEdits[k1] = { ...snap2, editedAt: today() };
  edStagedEdits[k2] = { ...snap1, editedAt: today() };

  // If the original plan cell was not rest but we're writing rest onto it,
  // the edit {type:'rest'} will override it in rebuildEditorPlan.
  // If the original plan cell was rest and we're writing a session,
  // the edit will inject the session — handled in rebuildEditorPlan fix below.

  rebuildEditorPlan();
  renderEditorGrid();
  if (edSelectedCell) {
    const s = plan[edSelectedCell.wi]?.sessions.find(s => s.day === edSelectedCell.day);
    renderEditorPanel(s, edSelectedCell.wi, edSelectedCell.day);
  }
  const arrow = snap1.type==='rest' ? '→' : snap2.type==='rest' ? '→' : '↔';
  showToast(`${arrow} Spostato: W${wi1+1}·${DAYS_S[d1]} ↔ W${wi2+1}·${DAYS_S[d2]}`);
}

function toggleGarminWeek(wi) {
  if (wi === 'all') {
    garminSelectedWeeks = garminSelectedWeeks.has('all') ? new Set() : new Set(['all']);
  } else {
    garminSelectedWeeks.delete('all');
    const k = wi.toString();
    if (garminSelectedWeeks.has(k)) garminSelectedWeeks.delete(k);
    else garminSelectedWeeks.add(k);
  }
  // Re-render just the garmin panel
  const gp = document.getElementById('garminPanel');
  if (gp) gp.outerHTML = renderGarminPanel();
}

function getExportSessions() {
  const all = garminSelectedWeeks.has('all');
  return plan
    .filter(w => all || garminSelectedWeeks.has(w.wi.toString()))
    .flatMap(w => w.sessions.filter(s => s.type !== 'rest' && s.type !== 'cross'))
    .map(s => ({ ...s, date: addDays(START, /* we need week */ 0) }));
}

function getExportWeeks() {
  const all = garminSelectedWeeks.has('all');
  return plan.filter(w => all || garminSelectedWeeks.has(w.wi.toString()));
}

// ── FIT BINARY EXPORT ──
// Garmin FIT workout file — binary protocol
// Spec: FIT Protocol v2.0 — Workout + WorkoutStep messages
function exportGarminFIT() {
  const weeks = getExportWeeks();
  const sessions = weeks.flatMap(w =>
    w.sessions
      .filter(s => s.type !== 'rest' && s.type !== 'cross')
      .map(s => ({ ...s, wi: w.wi }))
  );
  if (!sessions.length) { showToast('Seleziona almeno una settimana', true); return; }

  sessions.forEach((s, idx) => {
    const bytes = buildFITWorkout(s, idx);
    const blob  = new Blob([bytes], { type: 'application/octet-stream' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    const safe  = (s.special || SESS_META[s.type]?.label || 'run').replace(/[^a-zA-Z0-9]/g, '');
    a.href     = url;
    a.download = `W${s.wi+1}_${safe}.fit`;
    a.style.display='none';
    document.body.appendChild(a);
    setTimeout(() => { a.click(); a.remove(); URL.revokeObjectURL(url); }, idx * 400);
  });
  showToast(`⌚ ${sessions.length} file .fit pronti`);
}

// ─────────────────────────────────────────────────────────────
// FIT WORKOUT BUILDER — FIT Protocol 2.0, little-endian
// Tested against Garmin Connect's FIT validator
// ─────────────────────────────────────────────────────────────
function buildFITWorkout(session, fileIndex) {
  const goalMin = store[activePid]?.goalMin || 210;
  const z       = calcZones(goalMin);
  const zone    = z[session.zone] || z.easy;

  // Garmin stores pace targets as speed (m/s * 1000, i.e. mm/s)
  // FIT speed field = uint32, value in mm/s
  // pace lo (fastest) → higher speed; pace hi (slowest) → lower speed
  const spdFast = Math.round(1000000 / zone.lo);   // mm/s for fastest pace (zone.lo sec/km)
  const spdSlow = Math.round(1000000 / zone.hi);   // mm/s for slowest pace

  const distM   = Math.round((session.km || 10) * 1000);
  const warmM   = Math.min(2000, Math.round(distM * 0.15));
  const coolM   = Math.min(2000, Math.round(distM * 0.12));
  const mainM   = Math.max(500,  distM - warmM - coolM);

  const wktName = makeWktName(session);

  // Build step list
  const steps = buildFITSteps(session, spdFast, spdSlow, warmM, mainM, coolM);

  // ── Low-level writer ──────────────────────────────────────
  const buf = [];

  // Helper writers (little-endian)
  const w8  = v => buf.push(v & 0xFF);
  const w16 = v => { buf.push(v & 0xFF, (v >> 8) & 0xFF); };
  const w32 = v => {
    buf.push(v & 0xFF, (v>>8) & 0xFF, (v>>16) & 0xFF, (v>>24) & 0xFF);
  };
  const wStr = (s, len) => {
    for (let i = 0; i < len; i++) buf.push(i < s.length ? s.charCodeAt(i) & 0x7F : 0);
  };

  // FIT epoch = seconds since 1989-12-31 00:00:00 UTC
  const fitEpoch = Math.floor(Date.now() / 1000) - 631065600;

  // ── Message definitions ───────────────────────────────────
  // Definition message = 0x40 | localNum, reserved=0, arch=0(LE), globalNum(u16LE), fieldCount(u8), fields…
  // Each field descriptor: fieldDef(u8), size(u8), baseType(u8)

  // Local 0 → File ID (global 0)
  //  field 0: type       u8  (0x00)  value 5 = workout
  //  field 1: manufacturer u16 (0x84) value 1 = Garmin
  //  field 2: product u16, field 3: serial_number u32, field 4: time_created u32, field 5: number u16
  w8(0x40); w8(0); w8(0); w16(0); w8(6);
    w8(0); w8(1); w8(0x00);   // type: enum
    w8(1); w8(2); w8(0x84);   // manufacturer: uint16
    w8(2); w8(2); w8(0x84);   // product: uint16
    w8(3); w8(4); w8(0x86);   // serial_number: uint32
    w8(4); w8(4); w8(0x86);   // time_created: uint32
    w8(5); w8(2); w8(0x84);   // number: uint16

  // Data for local 0
  w8(0x00);
    w8(5);                    // type = workout
    w16(1);                   // manufacturer = Garmin
    w16(1);                   // product
    w32(1);                   // serial_number
    w32(fitEpoch);            // time_created
    w16(fileIndex);            // number

  // Local 1 → Workout (global 26): sport, sub_sport, step count, name.
  w8(0x41); w8(0); w8(0); w16(26); w8(4);
    w8(4); w8(1);  w8(0x00);
    w8(5); w8(1);  w8(0x00);
    w8(6); w8(2);  w8(0x84);
    w8(9); w8(17); w8(0x07);

  // Data for local 1
  w8(0x01);
    w8(1);                    // sport = running
    w8(0);                     // sub_sport = generic
    w16(steps.length);         // num_valid_steps
    wStr(wktName, 17);         // workout_name

  // Local 2 → Workout Step (global 27): index, name, duration and target fields.
  w8(0x42); w8(0); w8(0); w16(27); w8(8);
    w8(254); w8(2); w8(0x84);
    w8(0); w8(17); w8(0x07);
    w8(1); w8(1);  w8(0x00);
    w8(2); w8(4);  w8(0x86);
    w8(3); w8(1);  w8(0x00);
    w8(4); w8(4);  w8(0x86);
    w8(5); w8(4);  w8(0x86);
    w8(6); w8(4);  w8(0x86);
    w8(7); w8(1);  w8(0x00);

  // Data for local 2 (one per step)
  steps.forEach((step, i) => {
    w8(0x02);
    w16(i);                       // message_index
    wStr(step.name, 17);          // step name
    w8(step.durType);             // duration_type
    w32(step.durValue);           // duration value
    w8(step.tgtType);             // target_type
    w32(step.tgtType === 0 ? spdFast : 0xFFFFFFFF);
    w32(step.tgtType === 0 ? spdSlow : 0xFFFFFFFF);
    w32(step.tgtType === 0 ? spdFast : 0xFFFFFFFF);
    w8(step.intensity);           // intensity
  });

  // ── File header + CRC ────────────────────────────────────
  const dataBytes  = new Uint8Array(buf);
  const dataLen    = dataBytes.length;

  // Header (14 bytes)
  const hdr = new Uint8Array(14);
  hdr[0]  = 14;       // header size
  hdr[1]  = 0x10;     // protocol version 1.0 (more compatible than 2.0)
  hdr[2]  = 0x08;     // profile version low
  hdr[3]  = 0x00;     // profile version high (8.00)
  hdr[4]  = dataLen & 0xFF;
  hdr[5]  = (dataLen >> 8)  & 0xFF;
  hdr[6]  = (dataLen >> 16) & 0xFF;
  hdr[7]  = (dataLen >> 24) & 0xFF;
  hdr[8]  = 0x2E; hdr[9]  = 0x46;  // ".F"
  hdr[10] = 0x49; hdr[11] = 0x54;  // "IT"
  // Header CRC (covers bytes 0–11)
  const hdrCrc = fitCRC16(hdr.slice(0, 12));
  hdr[12] = hdrCrc & 0xFF;
  hdr[13] = (hdrCrc >> 8) & 0xFF;

  // Combine header + data
  const combined = new Uint8Array(14 + dataLen + 2);
  combined.set(hdr, 0);
  combined.set(dataBytes, 14);

  // File CRC (covers header + data)
  const fileCrc = fitCRC16(combined.slice(0, 14 + dataLen));
  combined[14 + dataLen]     = fileCrc & 0xFF;
  combined[14 + dataLen + 1] = (fileCrc >> 8) & 0xFF;

  return combined;
}

function buildFITSteps(session, spdFast, spdSlow, warmM, mainM, coolM) {
  // durType: 1=distance(m), 0=time(s), 5=open
  // tgtType: 0=speed(custom), 2=open
  // intensity: 0=active, 1=rest, 2=warmup, 3=cooldown
  const DIST = 1, OPEN_DUR = 5;
  const SPD  = 0, OPEN_TGT = 2;
  const ACTIVE = 0, REST = 1, WARM = 2, COOL = 3;

  if (session.type === 'rep') {
    const repM  = 1000, recM = 400;
    const nReps = Math.max(4, Math.min(12, Math.round((mainM * 0.65) / (repM + recM))));
    return [
      { name:'Riscaldamento', durType:DIST, durValue:warmM, tgtType:OPEN_TGT, intensity:WARM },
      ...Array.from({length:nReps}, (_,i) => ([
        { name:`Rep ${i+1}`,   durType:DIST, durValue:repM, tgtType:SPD, intensity:ACTIVE },
        { name:`Recupero`,     durType:DIST, durValue:recM, tgtType:OPEN_TGT, intensity:REST },
      ])).flat(),
      { name:'Defaticamento', durType:DIST, durValue:coolM, tgtType:OPEN_TGT, intensity:COOL },
    ];
  }

  if (session.type === 'medio') {
    const tempoM = mainM;
    return [
      { name:'Riscaldamento', durType:DIST, durValue:warmM,  tgtType:OPEN_TGT, intensity:WARM },
      { name:'Soglia',        durType:DIST, durValue:tempoM, tgtType:SPD,      intensity:ACTIVE },
      { name:'Defaticamento', durType:DIST, durValue:coolM,  tgtType:OPEN_TGT, intensity:COOL },
    ];
  }

  if (session.type === 'easy') {
    return [
      { name:'Corsa Facile', durType:DIST, durValue:warmM+mainM, tgtType:SPD, intensity:ACTIVE },
      { name:'Defaticamento',durType:DIST, durValue:coolM,        tgtType:OPEN_TGT, intensity:COOL },
    ];
  }

  // lungo, test, race, default
  return [
    { name:'Riscaldamento', durType:DIST, durValue:warmM, tgtType:OPEN_TGT, intensity:WARM },
    { name:'Corpo',         durType:DIST, durValue:mainM, tgtType:SPD,      intensity:ACTIVE },
    { name:'Defaticamento', durType:DIST, durValue:coolM, tgtType:OPEN_TGT, intensity:COOL },
  ];
}

function makeWktName(s) {
  const sm   = SESS_META[s.type] || SESS_META.easy;
  const label = (s.special || sm.label || 'Workout')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const raw  = `W${s.wi+1} ${label} ${s.km||''}km`.trim();
  return raw.slice(0, 16); // max 16 chars + null → fits in 17-byte field
}

function fitCRC16(data) {
  const CRC_TABLE = [
    0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401,
    0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400,
  ];
  let crc = 0;
  for (const byte of data) {
    let tmp = CRC_TABLE[crc & 0x0F];
    crc = (crc >> 4) & 0x0FFF;
    crc ^= tmp ^ CRC_TABLE[byte & 0x0F];
    tmp = CRC_TABLE[crc & 0x0F];
    crc = (crc >> 4) & 0x0FFF;
    crc ^= tmp ^ CRC_TABLE[(byte >> 4) & 0x0F];
  }
  return crc;
}

// Legacy aliases (used by older code)
function fitCRC(bytes) { return fitCRC16(bytes); }
function u16(v)   { return [(v) & 0xFF, (v >> 8) & 0xFF]; }
function u16LE(v) { return [(v) & 0xFF, (v >> 8) & 0xFF]; }
function u32(v)   { return [(v)&0xFF, (v>>8)&0xFF, (v>>16)&0xFF, (v>>24)&0xFF]; }
function u32LE(v) { return u32(v); }
function strToBytes(str, len) {
  const out = new Array(len).fill(0);
  for (let i = 0; i < Math.min(str.length, len - 1); i++) out[i] = str.charCodeAt(i) & 0x7F;
  return out;
}

  function icsDate(d) {
    return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  }

  const events = weeks.flatMap(w =>
    w.sessions
      .filter(s => s.type !== 'rest')
      .map(s => {

        const start = new Date(date); start.setHours(7,0,0,0);
        const durMin= s.type==='cross' ? (s.dur||50) : Math.round((s.km||10) * (z[s.zone]?.lo||300) / 60);
        const end   = new Date(start.getTime() + durMin * 60000);
        const zone  = z[s.zone];
        const paceInfo = zone ? `Ritmo: ${fmtPace(zone.lo)}–${fmtPace(zone.hi)} /km\n` : '';
        const summary = `${s.special||SESS_META[s.type]?.label||'Allenamento'} — ${s.type==='cross'?s.dur+'min':(s.km||'?')+'km'} — W${w.wi+1}`;
        return `BEGIN:VEVENT
UID:mfirenze-w${w.wi}-d${s.day}-${Date.now()}@maratonafirenze
DTSTAMP:${icsDate(new Date())}
DTSTART:${icsDate(start)}
DTEND:${icsDate(end)}
SUMMARY:${summary}
DESCRIPTION:${paceInfo}${(s.desc||'').replace(/\n/g,'\\n')}
CATEGORIES:ALLENAMENTO,CORSA
STATUS:CONFIRMED
END:VEVENT`;
      })
  ).join('\n');

  const ics = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Maratona Firenze//Piano Allenamento//IT
CALNAME:Maratona Firenze — ${p?.name||'Atleta'}
X-WR-CALNAME:Maratona Firenze
X-WR-TIMEZONE:Europe/Rome
${events}
END:VCALENDAR`;

  const ts = new Date().toISOString().slice(0,10);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `maratona-firenze-${ts}.ics`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('📅 Calendario ICS scaricato');
}

function parsePaceToSec(str) {
  if (!str) return null;
  const parts = str.toString().split(':').map(Number);
  if (parts.length === 2) return parts[0]*60 + parts[1];
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return null;
}

function parseGPX(text) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/xml');
  const trk = doc.querySelector('trk');
  if (!trk) return null;
  const name = trk.querySelector('name')?.textContent || 'Attività GPX';
  const pts  = [...doc.querySelectorAll('trkpt')];
  if (!pts.length) return null;

  let distM = 0, totalHR = 0, hrCount = 0;
  const times = [];
  for (let i = 1; i < pts.length; i++) {
    const lat1 = parseFloat(pts[i-1].getAttribute('lat')), lon1 = parseFloat(pts[i-1].getAttribute('lon'));
    const lat2 = parseFloat(pts[i].getAttribute('lat')),   lon2 = parseFloat(pts[i].getAttribute('lon'));
    distM += haversineM(lat1, lon1, lat2, lon2);
    const hr = pts[i].querySelector('hr,heartrate')?.textContent;
    if (hr) { totalHR += parseInt(hr); hrCount++; }
    const t = pts[i].querySelector('time')?.textContent;
    if (t) times.push(new Date(t));
  }
  const firstTime = times[0] || new Date(pts[0].querySelector('time')?.textContent || Date.now());
  const lastTime  = times[times.length-1] || firstTime;
  const durationSec = (lastTime - firstTime) / 1000;
  const km = distM / 1000;
  const paceSec = km > 0 && durationSec > 0 ? durationSec / km : null;

  return {
    source:'gpx', name, date: firstTime.toISOString().split('T')[0],
    km: Math.round(km*100)/100,
    durationSec: Math.round(durationSec),
    pace: paceSec ? fmtPace(Math.round(paceSec)) : null,
    hr: hrCount ? Math.round(totalHR/hrCount) : null,
  };
}

function parseTCX(text) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/xml');
  const activities = [...doc.getElementsByTagNameNS('*','Activity')];
  return activities.map(act => {
    const childText=(tag,root=act)=>root.getElementsByTagNameNS('*',tag)[0]?.textContent||'';
    const date = childText('Id').split('T')[0] || today();
    const name = childText('Notes') || 'Attività TCX';
    const laps = [...act.getElementsByTagNameNS('*','Lap')];
    let distM = 0, totalTime = 0, totalHR = 0, hrCount = 0;
    laps.forEach(lap => {
      const lapText=tag=>lap.getElementsByTagNameNS('*',tag)[0]?.textContent||'';
      distM    += parseFloat(lapText('DistanceMeters')) || 0;
      totalTime += parseFloat(lapText('TotalTimeSeconds')) || 0;
      const hr = lapText('Value');
      if (hr) { totalHR += parseInt(hr); hrCount++; }
    });
    const km = distM / 1000;
    const paceSec = km > 0 && totalTime > 0 ? totalTime / km : null;
    return {
      source:'tcx', name, date, km: Math.round(km*100)/100,
      durationSec: Math.round(totalTime),
      pace: paceSec ? fmtPace(Math.round(paceSec)) : null,
      hr: hrCount ? Math.round(totalHR/hrCount) : null,
    };
  }).filter(a => a.km > 0);
}

function parseFIT(buffer) {
  const bytes=new Uint8Array(buffer);
  if(bytes.length<14 || String.fromCharCode(...bytes.slice(8,12))!=='.FIT') return [];
  const headerSize=bytes[0],dataSize=bytes[4]|(bytes[5]<<8)|(bytes[6]<<16)|(bytes[7]<<24);
  const view=new DataView(buffer), definitions={}, records=[];
  let offset=headerSize, end=Math.min(bytes.length,headerSize+dataSize),lastTimestamp=null;
  const readValue=(raw,base,size,scale,offsetValue)=>{
    if(raw===null)return null;
    let value;
    if(base===0x06)value=view.getUint32(raw,true);
    else if(base===0x04)value=view.getUint16(raw,true);
    else if(base===0x07)value=view.getUint32(raw,false);
    else if(base===0x05)value=view.getUint16(raw,false);
    else if(base===0x02)value=bytes[raw];
    else if(base===0x01)value=bytes[raw];
    else value=bytes[raw];
    if(value===0xffffffff||value===0xffff||value===0xff)return null;
    return (value-(offsetValue||0))/(scale||1);
  };
  while(offset<end){
    const header=bytes[offset++],compressed=(header&0x80)!==0;
    if(compressed){
      const local=(header>>5)&3,def=definitions[local];
      if(!def){offset++;continue;}
      const fields={};
      def.fields.filter(field=>field.num!==253).forEach(field=>{const pos=offset;offset+=field.size;fields[field.num]=readValue(pos,field.base,field.size,field.scale,field.offset);});
      if(lastTimestamp!==null){
        const delta=header&0x1f;
        lastTimestamp+=((delta-(lastTimestamp&0x1f)+32)%32);
        fields[253]=lastTimestamp;
      }
      if(def.global===20)records.push(fields);
      continue;
    }
    const isDefinition=(header&0x40)!==0,local=header&0x0f;
    if(isDefinition){
      offset+=2;
      const global=view.getUint16(offset,true); offset+=2;
      const fieldCount=bytes[offset++],fields=[];
      for(let i=0;i<fieldCount;i++){
        const num=bytes[offset++],size=bytes[offset++],base=bytes[offset++];
        const scale=global===20&&num===5?100:global===20&&num===6?1000:1;
        fields.push({num,size,base:base&0x1f,scale,offset:0});
      }
      definitions[local]={global,fields};
      continue;
    }
    const def=definitions[local];
    if(!def){offset++;continue;}
    const fields={};
    def.fields.forEach(field=>{const pos=offset;offset+=field.size;fields[field.num]=readValue(pos,field.base,field.size,field.scale,field.offset);});
    if(fields[253]!==null&&fields[253]!==undefined)lastTimestamp=fields[253];
    if(def.global===20)records.push(fields);
  }
  if(!records.length)return [];
  const distanceMeters=records.reduce((max,r)=>Math.max(max,typeof r[5]==='number'?r[5]:0),0);
  const firstTime=records.find(r=>r[253])?.[253];
  const lastTime=records.slice().reverse().find(r=>r[253])?.[253];
  const durationSec=firstTime&&lastTime?lastTime-firstTime:null;
  const km=distanceMeters/1000||((records.reduce((sum,r)=>sum+(typeof r[6]==='number'?r[6]:0),0)*(durationSec||0))/3600/1000);
  if(!km)return [];
  const pace=durationSec&&km?durationSec/km:null;
  const hrValues=records.map(r=>r[3]).filter(v=>typeof v==='number'&&v>0&&v<250);
  const fitEpoch=631065600;
  return [{source:'fit',name:'Attività FIT',date:firstTime?new Date((firstTime+fitEpoch)*1000).toISOString().split('T')[0]:today(),km:Math.round(km*100)/100,durationSec:durationSec||null,pace:pace?fmtPace(Math.round(pace)):null,hr:hrValues.length?Math.round(hrValues.reduce((a,b)=>a+b,0)/hrValues.length):null}];
}

function parseGarminCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
  const idx = k => headers.findIndex(h => h.includes(k));
  const iDate=idx('date'), iDist=idx('distance'), iTime=idx('time'), iPace=idx('avg pace'), iHR=idx('avg hr'), iTitle=idx('title');
  return lines.slice(1).map(line => {
    const cols = line.match(/(".*?"|[^,]+)/g)?.map(c=>c.replace(/"/g,'').trim()) || [];
    const km = parseFloat(cols[iDist]?.replace(',','.')) || 0;
    if (!km) return null;
    const rawPace = cols[iPace] || '';
    const [pm,ps] = rawPace.split(':').map(Number);
    const paceSec = pm && ps ? pm*60+ps : null;
    return {
      source:'csv', name: cols[iTitle] || 'Attività',
      date: cols[iDate] || today(),
      km: Math.round(km*100)/100,
      durationSec: null,
      pace: paceSec ? fmtPace(paceSec) : (rawPace || null),
      hr: cols[iHR] ? parseInt(cols[iHR]) : null,
    };
  }).filter(Boolean);
}

function parseActivitiesJSON(text) {
  try {
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : (data.activities || data.workouts || []);
    return arr.map(a => ({
      source:'json',
      name: a.name || a.title || a.activityName || 'Attività',
      date: (a.date || a.startTime || a.start_time || '').split('T')[0] || today(),
      km:   parseFloat(a.km || a.distance || a.distanceKm || (a.distanceMeters/1000) || 0),
      durationSec: a.durationSec || a.duration || a.elapsedTime || null,
      pace: a.pace || a.avgPace || a.averagePace || null,
      hr:   a.hr || a.avgHR || a.averageHeartRate || null,
    })).filter(a => a.km > 0);
  } catch { return []; }
}

function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Match an imported activity to a plan session by date proximity
function matchActivityToSession(activity) {
  const actDate = new Date(activity.date);
  if (isNaN(actDate)) return null;
  const actDay = (actDate.getDay()+6)%7; // Mon=0
  const wi = Math.floor((actDate - START) / (7*86400000));
  if (wi < 0 || wi >= 14) return { wi: null, matched: false };
  // Exact day match
  const week = plan[wi];
  const sessExact = week?.sessions.find(s => s.day === actDay && s.type !== 'rest');
  if (sessExact) return { wi, day: actDay, matched: true, session: sessExact };
  // Nearest non-rest session in same week ±1 day
  for (let d = 0; d < 7; d++) {
    const s = week?.sessions.find(s => s.day === d && s.type !== 'rest');
    if (s) return { wi, day: d, matched: false, session: s };
  }
  return { wi, matched: false };
}

// Persist imported activities on profile
function importActivities(input) {
  const files = [...input.files];
  if (!files.length) return;
  let parsed = [];
  let pending = files.length;

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      let acts = [];
      const ext = file.name.split('.').pop().toLowerCase();
      try {
        if (ext === 'fit') acts = parseFIT(e.target.result);
        else {
          const text = e.target.result;
          if (ext === 'gpx') { const a = parseGPX(text); if (a) acts = [a]; }
          else if (ext === 'tcx') acts = parseTCX(text);
          else if (ext === 'csv') acts = parseGarminCSV(text);
          else if (ext === 'json') acts = parseActivitiesJSON(text);
        }
      } catch(err) { console.warn('Parse error', file.name, err); }
      parsed = parsed.concat(acts);
      pending--;
      if (pending === 0) finishImport(parsed);
    };
    reader[ext === 'fit' ? 'readAsArrayBuffer' : 'readAsText'](file);
  });
  input.value = '';
}

function finishImport(activities) {
  if (!activities.length) { showToast('Nessuna attività trovata nei file',true); return; }
  // Merge into profile activities store
  if (!store[activePid].activities) store[activePid].activities = [];
  const existing = store[activePid].activities;
  let added = 0;
  activities.forEach(act => {
    // Deduplicate by date+km
    const dup = existing.find(e => e.date===act.date && Math.abs((e.km||0)-(act.km||0))<0.5);
    if (!dup) { existing.push({...act, importedAt:today()}); added++; }
  });
  saveStore(store);
  // Auto-merge into log where matched exactly
  autoMergeActivitiesToLog();
  showToast(`✅ ${added} attività importate (${activities.length-added} duplicate ignorate)`);
  if (activeTab === 'compare') renderCompare();
  else switchTab('compare');
}

// Auto-populate log entries from imported activities where exact date match
function autoMergeActivitiesToLog() {
  const acts = store[activePid].activities || [];
  const log   = store[activePid].log || {};
  acts.forEach(act => {
    const match = matchActivityToSession(act);
    if (!match || !match.matched) return;
    const k = `w${match.wi}_d${match.day}`;
    if (log[k]) return; // don't overwrite manual entries
    log[k] = {
      completed: true,
      date:  act.date,
      km:    act.km?.toString() || '',
      pace:  act.pace || '',
      hr:    act.hr?.toString() || '',
      feel:  3,
      note:  `Importato da ${act.source?.toUpperCase()} — ${act.name}`,
      savedAt: today(),
      fromImport: true,
    };
  });
  store[activePid].log = log;
  saveStore(store);
}

        const y = pad.t+f*iH;
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
        const pace = Math.round(maxP-(maxP-minP)*f);
        ctx.fillStyle='#5a5e70'; ctx.font='10px DM Mono,monospace'; ctx.textAlign='right';
        ctx.fillText(fmtPace(pace), pad.l-4, y+4);
      });

      // Plan pace line (dashed)
      ctx.strokeStyle='rgba(255,92,53,0.5)'; ctx.lineWidth=1.5;
      ctx.setLineDash([5,4]);
      ctx.beginPath();
      pacePoints.forEach((p,i)=>{ const x=xOf(i),y=yOf(p.planPace); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke(); ctx.setLineDash([]);

      // Real pace area fill
      ctx.fillStyle='rgba(56,189,248,0.08)';
      ctx.beginPath();
      pacePoints.forEach((p,i)=>{ const x=xOf(i),y=yOf(p.realPace); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.lineTo(xOf(pacePoints.length-1), pad.t+iH);
      ctx.lineTo(xOf(0), pad.t+iH);
      ctx.closePath(); ctx.fill();

      // Real pace line
      ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2.5;
      ctx.beginPath();
      pacePoints.forEach((p,i)=>{ const x=xOf(i),y=yOf(p.realPace); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();

      // Dots
      pacePoints.forEach((p,i)=>{
        ctx.fillStyle='#38bdf8';
        ctx.beginPath(); ctx.arc(xOf(i),yOf(p.realPace),3.5,0,Math.PI*2); ctx.fill();
      });

      // X labels (every ~4)
      ctx.fillStyle='#5a5e70'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='center';
      pacePoints.forEach((p,i)=>{
        if (i%Math.max(1,Math.floor(pacePoints.length/8))===0) {
          ctx.fillText(p.label, xOf(i), H-6);
        }
      });
    });
  }
}

function renderImportPreview(activities) {
  const recent = activities.slice(-10).reverse();
  return `<div class="import-preview">
    ${recent.map(act => {
      const m = matchActivityToSession(act);
      const badgeCls = !m ? 'none' : m.matched ? 'ok' : 'guess';
      const badgeTxt = !m ? 'fuori piano' : m.matched ? `→ W${m.wi+1} ${DAYS_S[m.day]}` : `~W${m.wi+1}`;
      return `<div class="import-row ${m?.matched?'matched':''}">
        <div style="font-size:1rem">🏃</div>
        <div class="import-row-info">
          <div class="import-row-name">${act.name||'Attività'}</div>
          <div class="import-row-date">${act.date} · ${act.source?.toUpperCase()}</div>
          <div class="import-row-stats">
            ${act.km?`<span class="import-stat" style="color:#34d399">📏 ${act.km}km</span>`:''}
            ${act.pace?`<span class="import-stat" style="color:#f5c842">⏱ ${act.pace}/km</span>`:''}
            ${act.hr?`<span class="import-stat" style="color:#fb7185">❤️ ${act.hr}bpm</span>`:''}
          </div>
        </div>
        <span class="import-match-badge ${badgeCls}">${badgeTxt}</span>
      </div>`;
    }).join('')}
  </div>`;
}

function actDropHandler(e) {
  e.preventDefault();
  document.getElementById('actDropZone')?.classList.remove('drag-active');
  const files = [...e.dataTransfer.files].filter(f => /\.(gpx|tcx|fit|json|csv)$/i.test(f.name));
  if (!files.length) { showToast('Formato non supportato — usa GPX, TCX, FIT, CSV o JSON',true); return; }
  // Reuse importActivities logic
  const fakeInput = { files };
  importActivities(fakeInput);
}

function clearActivities() {
  if (!confirm('Rimuovere tutte le attività importate? Le sessioni del log manuale non verranno cancellate.')) return;
  store[activePid].activities = [];
  saveStore(store);
  renderCompare();
  showToast('🗑 Attività importate rimosse');
}

// ═══════════════════════════════════════════════════════════════
// PRINT
// ═══════════════════════════════════════════════════════════════
function printPlan() {
  const p   = store[activePid];
  const pd  = PROFILES_DEF[p.profileKey || 'intermediate'] || PROFILES_DEF.intermediate;
  const z   = calcZones(p.goalMin || 210);
  const log = p.log || {};

  const COLORS = {
    easy:'#22a26a', rep:'#7c3aed', medio:'#d97706',
    lungo:'#dc2626', cross:'#0284c7', race:'#e8541a', test:'#0d9488', rest:'#ccc',
  };

  /* ── helpers ── */
  const dot   = type => `<div class="pr-sess-dot" style="background:${COLORS[type]||'#888'}"></div>`;
  const tagCls= tag  => ({picco:'picco',scarico:'scarico',gara:'gara',race:'gara'}[tag]||'');

  /* ── session cell HTML ── */
  function prSession(session, wi) {
    const m   = SESS_META[session.type] || SESS_META.rest;
    const k   = `w${wi}_d${session.day}`;
    const lg  = log[k];
    const isRest  = session.type === 'rest';
    const isCross = session.type === 'cross';
    const logBadge = lg ? `<div style="font-size:6pt;color:${lg.completed?'#16a34a':'#dc2626'};margin-top:.5mm">
      ${lg.completed ? `✓ ${lg.km||''}km ${lg.pace?lg.pace+'/km':''} ${lg.hr?lg.hr+'bpm':''}` : '✗ saltato'}
    </div>` : '';
    if (isRest) return `<div class="pr-session rest-cell">
      <div class="pr-sess-day">${DAYS_S[session.day]}</div>
      <div class="pr-rest-lbl">Riposo</div>
    </div>`;
    const kmDisp = session.km === 42.195 ? '42.2 km'
                 : session.km            ? `${session.km} km`
                 : session.dur           ? `${session.dur} min` : '';
    const paceDisp = (!isCross && session.zone && z[session.zone])
                   ? `${fmtPace(z[session.zone].lo)}–${fmtPace(z[session.zone].hi)} /km` : '';
    return `<div class="pr-session">
      <div class="pr-sess-day">${DAYS_S[session.day]}</div>
      <div class="pr-sess-type">${dot(session.type)}
        <span class="pr-sess-lbl" style="color:${COLORS[session.type]||'#555'}">${session.special||m.label}</span>
      </div>
      <div class="pr-sess-km">${kmDisp}</div>
      <div class="pr-sess-desc">${session.desc||''}</div>
      ${paceDisp ? `<div class="pr-sess-pace">${paceDisp}</div>` : ''}
      ${logBadge}
    </div>`;
  }

  /* ── week block HTML ── */
  function prWeek(week) {
    const tag = week.tag;
    const tagLabels = {race:'🏅 Gara',gara:'Gara Test',picco:'Picco',scarico:'Scarico',carico:'Carico'};
    return `<div class="pr-week">
      <div class="pr-week-hdr">
        <span class="pr-week-n">${week.label}</span>
        <span class="pr-week-date">${week.dateRange}</span>
        <span class="pr-week-km">~${formatPlanKm(getWeekPlanKm(week))} km</span>
        <span class="pr-week-tag ${tagCls(tag)}">${tagLabels[tag]||tag}</span>
      </div>
      <div class="pr-sessions">
        ${week.sessions.map(s => prSession(s, week.wi)).join('')}
      </div>
    </div>`;
  }

  /* ── phase ── */
  function prPhase(name, weeks) {
    return `<div class="pr-phase">${name}</div>
    ${weeks.map(wi => prWeek(plan[wi])).join('')}`;
  }

  /* ── cover ── */
  const mpSec = z.mp.lo;
  const peakWeek = plan.find(week => week.isPeak) || plan[9];
  const peakLongSession = peakWeek?.sessions.find(session => session.type === 'lungo' && session.km);
  const peakLongKm = peakLongSession?.km || pd.peakLong;
  const zonePills = [
    {l:'Facile', z:'easy'}, {l:'MP', z:'mp'}, {l:'Soglia', z:'threshold'}, {l:'Ripetute', z:'rep'}
  ].map(({l,zk=z,zone=z}) => {
    const zz = z[l==='Facile'?'easy':l==='MP'?'mp':l==='Soglia'?'threshold':'rep'];
    return `<div class="pr-zone-pill"><span class="pr-zone-lbl">${l}:</span> ${fmtPace(zz.lo)}–${fmtPace(zz.hi)} /km</div>`;
  }).join('');

  const cover = `<div class="pr-cover">
    <div class="pr-cover-eyebrow">Piano di Allenamento Personalizzato · 14 Settimane</div>
    <div class="pr-cover-title">Maratona<br><em>Firenze</em></div>
    <div class="pr-cover-meta">
      <div class="pr-cover-stat"><span class="pr-cover-val">${p.name}</span><span class="pr-cover-lbl">Atleta</span></div>
      <div class="pr-cover-stat"><span class="pr-cover-val">${pd.icon} ${pd.name}</span><span class="pr-cover-lbl">Profilo</span></div>
      <div class="pr-cover-stat"><span class="pr-cover-val">${fmtGoal(p.goalMin||210)}</span><span class="pr-cover-lbl">Obiettivo</span></div>
      <div class="pr-cover-stat"><span class="pr-cover-val">${fmtPace(mpSec)} /km</span><span class="pr-cover-lbl">Ritmo MP</span></div>
      <div class="pr-cover-stat"><span class="pr-cover-val">28 Nov 2026</span><span class="pr-cover-lbl">Data gara</span></div>
      <div class="pr-cover-stat"><span class="pr-cover-val">${formatPlanKm(peakLongKm)} km</span><span class="pr-cover-lbl">Lungo picco</span></div>
    </div>
    <div class="pr-cover-zones">${zonePills}</div>
  </div>`;

  /* ── pace legend page ── */
  const legendRows = [
    {type:'easy',  name:'Facile / Recupero',  zone:'easy',      desc:'Conversazione facile. FC 65–72%. Fondamentale per assorbire il carico.'},
    {type:'lungo', name:'Lungo Aerobico',      zone:'longEasy',  desc:'Sviluppa il motore aerobico. FC 70–78%. Gel ogni 40\' dal km 15.'},
    {type:'medio', name:'Ritmo Maratona (MP)', zone:'mp',        desc:'Il ritmo gara. FC 82–87%. Confortevole ma controllato.'},
    {type:'medio', name:'Soglia / Medio',      zone:'threshold', desc:'Comfortably hard. FC 87–92%. Alza il lattato threshold.'},
    {type:'rep',   name:'Ripetute / Qualità',  zone:'rep',       desc:'Sforzo alto. FC 92–97%. Migliora VO₂max ed economia di corsa.'},
    {type:'cross', name:'Cross Training',      zone:null,        desc:'Bici, nuoto o ellittica. FC 65–78%. Carico aerobico senza impatto.'},
  ].map(r => {
    const zz = r.zone ? z[r.zone] : null;
    return `<div class="pr-legend-row">
      <div class="pr-legend-dot" style="background:${COLORS[r.type]||'#888'}"></div>
      <div class="pr-legend-info">
        <div class="pr-legend-name">${r.name}</div>
        ${zz ? `<div class="pr-legend-pace">${fmtPace(zz.lo)} – ${fmtPace(zz.hi)} /km</div>` : '<div class="pr-legend-pace">—</div>'}
        <div class="pr-legend-desc">${r.desc}</div>
      </div>
    </div>`;
  }).join('');

  const tips = [
    {icon:'🥗', title:'Nutrizione',   body:'Carboidrati la sera prima dei lunghi. Gel ogni 40–45\' dal km 15. In gara solo prodotti già testati. 60–90g CHO/ora.'},
    {icon:'💤', title:'Recupero',     body:'8h di sonno nelle settimane di carico. Foam roller 2×/sett. Le settimane di scarico non sono opzionali.'},
    {icon:'🚴', title:'Cross Train.', body:'Bici = forza gambe. Nuoto = recupero attivo. Nel taper riduci a 30–40\' leggero.'},
    {icon:'🏁', title:'Gara',         body:'Parti 5–8" lento nei primi 5 km. Costante fino al km 30. Dal km 30 dai tutto. Carbo-load gio-ven pre-gara.'},
  ].map(t => `<div class="pr-tip">
    <div class="pr-tip-title">${t.icon} ${t.title}</div>
    <div class="pr-tip-body">${t.body}</div>
  </div>`).join('');

  const legendPage = `<div class="pr-legend-page">
    <div class="pr-legend-title">⚡ Zone di Allenamento · ${p.name} · Obiettivo ${fmtGoal(p.goalMin||210)}</div>
    <div class="pr-legend-grid">${legendRows}</div>
    <div class="pr-tip-grid">${tips}</div>
    <div class="pr-footer">
      Maratona di Firenze · 28 novembre 2026 · Piano generato il ${new Date().toLocaleDateString('it-IT')} ·
      ${pd.icon} ${p.name} · Obiettivo ${fmtGoal(p.goalMin||210)} · MP ${fmtPace(mpSec)} /km
    </div>
  </div>`;

  /* ── assemble and print ── */
  document.getElementById('printContainer').innerHTML =
    cover +
    prPhase('Fase 1 — Base Aerobica',      [0,1,2,3]) +
    prPhase('Fase 2 — Sviluppo Specifico', [4,5,6,7,8]) +
    prPhase('Fase 3 — Picco & Taper',      [9,10,11,12,13]) +
    legendPage;

  window.print();
}

function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = next === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem('mf-theme', next); } catch {}
}
function applyTheme(){
  const t = localStorage.getItem('mf-theme') || 'dark';
  if (t === 'light') {
    document.documentElement.setAttribute('data-theme','light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
}

applyTheme();
store = loadStore();   // carica localStorage come fallback
syncFromFirebase();    // Firebase carica i dati e poi chiama renderProfiles()
</script>
